# A regression test of the encoding/json codec generator (models/json/jsongen.py) over the types of
# types.go: only the roots are listed, their structure is derived by reflection. Generate from the
# repository root:
#     models/json/jsongen.py models/internal/jsondifftest/json.toml models/internal/jsondifftest/codec --pkg codec
# codec/json_gen_test.go checks the codec against the real encoding/json.
[json]
imports = { jsondifftest = "models.lab/internal/jsondifftest" }
roots = ["jsondifftest.Msg", "jsondifftest.Body", "[]jsondifftest.Item", "jsondifftest.Event",
         "jsondifftest.All", "uint64", "string",
         'struct { Seq uint64 "json:\"seq,string\""; Data json.RawMessage "json:\"data\"" }']
