name = "etcdGrove"
defaultTargets = ["EtcdGrove", "RaftWitness", "PorcupineDag", "Bbolt", "LinuxFs"]

# The Perennial framework, including the Goose translator that produced `Code/` and
# `GeneratedProof/` (checked by `etc/goose.py --check`). The pin follows branch `lean` of
# mit-pdos/perennial (notes/STATUS.md, "Perennial: the pin follows `lean`").
[[require]]
name = "perennial"
git = "https://github.com/mit-pdos/perennial"
rev = "ddc0f0acc59a5730ad109be9ecfc4a485dcc4ea0"

# Everything here, laid out by kind and then by Go package path:
#   Code/<pkg>, GeneratedProof/<pkg>  the Goose translations of raft and of etcd's
#                                     cache package and server, generated by
#                                     `etc/goose.py`; do not edit by hand
#   TrustedCode/<pkg>, ManualProof/<pkg> the models of a translation's `trusted` declarations
#                                     (trusted), and the module its generated proof imports
#   Spec/<pkg>/<fn>                   the Hoare triple of a Go function of package <pkg>
#   Proof/<pkg>/<fn>                  its proof; Proof/go_etcd_io/raft/v3/ also holds
#                                     the Raft proof's shared definitions, Link, Results,
#                                     Proof/go_etcd_io/etcd/cache/v3/ the cache's and
#                                     Proof/go_etcd_io/etcd/server/v3/etcdserver/ the
#                                     server's
#   GooseLang/Ext/<Name>, Proof/<Name>Prelude  this repository's GooseLang extensions
#                                     (trusted), as Perennial's
[[lean_lib]]
name = "EtcdGrove"
globs = ["Code.+", "TrustedCode.+", "GeneratedProof.+", "ManualProof.+", "Spec.+", "Proof.+",
         "GooseLang.+"]

# The witness experiment (notes/raft-witness.md): raft with witness support (a candidate for
# etcd-io/raft#133) and the key-value store on it, in a parallel tree with the same layout
# (RaftWitness/{Code,TrustedCode,GeneratedProof,ManualProof,Spec,Proof}/, translated by
# etc/goose.py's projects raft-witness and kvwitness). It imports the main tree, but not its raft
# or kv, and nothing outside it imports it: its modules declare the main raft's names.
[[lean_lib]]
name = "RaftWitness"
globs = ["RaftWitness.+"]

# porcupine's pull request #46 (the DAG search; notes/porcupine-dag-plan.md), vendored in
# third_party/porcupine-dag and translated by etc/goose.py's project porcupine-dag into a parallel
# tree with the same layout (PorcupineDag/{Code,GeneratedProof,Spec,Proof}/): the Go path is
# v1.3.1's, so its modules declare the main porcupine's names; nothing outside it imports it.
[[lean_lib]]
name = "PorcupineDag"
globs = ["PorcupineDag.+"]

# bbolt's top-level test (examples/bbolt/bank) and bbolt itself with its bodies (the fork
# upamanyus/bbolt, branch goose-lean), translated by etc/goose.py's projects bbolt and bbolttest
# into a parallel tree with the same layout (Bbolt/{Code,GeneratedProof,Spec,Proof}/): the main
# tree translates go.etcd.io/bbolt names-only, for etcd, so the two declare the same names;
# nothing outside Bbolt imports it. Its file calls are the Linux file extension's (project
# bboltfs's `os`, `syscall`, `golang.org/x/sys/unix`).
[[lean_lib]]
name = "Bbolt"
globs = ["Bbolt.+"]

# The per-byte Linux file extension's `os`, `syscall`, `golang.org/x/sys/unix`, `io/fs` and their
# models (`GooseLang/Ext/Fs`, notes/fs-semantics-v2.md), with the programs proved over it
# (examples/osfs/{bboltfs,crashlog,walfs}), in a parallel tree with the same layout
# (LinuxFs/{Code,TrustedCode,GeneratedProof,ManualProof,Spec,Proof}/; etc/goose.py's project
# bboltfs's part and projects crashlog, walfs): the main tree's `os` is the first extension's
# (`GooseLang/Ext/OsFs`, real bbolt's), so the two declare the same names; nothing outside LinuxFs
# imports it. Until real bbolt is ported onto the new extension (branch `bbolt-port-wip`).
[[lean_lib]]
name = "LinuxFs"
globs = ["LinuxFs.+"]

[leanOptions]
linter.unusedSectionVars = false
