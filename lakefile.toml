name = "etcdGrove"
defaultTargets = ["EtcdGrove"]

# The Perennial framework (Lean port, branch `lean` of mit-pdos/perennial). The Goose
# translation of etcd-raft lives here (`EtcdGrove/Code`, `EtcdGrove/GeneratedProof`;
# regenerate with `etc/update-goose.py`), since 2026-10-08.
[[require]]
name = "perennial"
git = "https://github.com/mit-pdos/perennial"
rev = "abbd678c1d060617845ccb24b55da8a1a8a71eeb"

# Proofs about etcd (starting with its Raft implementation).
[[lean_lib]]
name = "EtcdGrove"

[leanOptions]
linter.unusedSectionVars = false
