name = "etcdGrove"
defaultTargets = ["EtcdGrove", "EtcdRaft", "EtcdCache", "GoogleBtree"]

# The Perennial framework (branch `lean` of mit-pdos/perennial), including the
# Goose translator that produced `EtcdRaft/`, `EtcdCache/` and `GoogleBtree/` (checked by
# `etc/goose.py --check`).
[[require]]
name = "perennial"
git = "https://github.com/mit-pdos/perennial"
rev = "584b17c549ac4c2c857766856a5afaed8c46a23e"

# The Goose translation of etcd-raft (`EtcdRaft.Code.go_etcd_io.raft.v3` and
# `EtcdRaft.GeneratedProof.go_etcd_io.raft.v3`, with its subpackages), generated by
# `etc/goose.py`; do not edit by hand.
[[lean_lib]]
name = "EtcdRaft"
globs = ["EtcdRaft.+"]

# The Goose translation of google/btree (`GoogleBtree.Code.github_com.google.btree`,
# `GoogleBtree.GeneratedProof.github_com.google.btree`), generated by `etc/goose.py`;
# do not edit by hand.
[[lean_lib]]
name = "GoogleBtree"
globs = ["GoogleBtree.+"]

# The Goose translation of etcd's `cache` package (`EtcdCache.Code.go_etcd_io.etcd.cache.v3`,
# with bodies) and of the types and names of what it uses (`client/v3`, `api/v3/{mvccpb,
# etcdserverpb,v3rpc/rpctypes}`, `k8s.io/utils/.../btree`, and protobuf's `protoimpl` and
# `internal/impl` for the messages' fields), generated by `etc/goose.py`;
# do not edit by hand.
[[lean_lib]]
name = "EtcdCache"
globs = ["EtcdCache.+"]

# Proofs about etcd (starting with its Raft implementation).
[[lean_lib]]
name = "EtcdGrove"

[leanOptions]
linter.unusedSectionVars = false
