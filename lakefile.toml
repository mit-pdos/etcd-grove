name = "etcdGrove"
defaultTargets = ["EtcdGrove"]

# The Perennial framework (branch `lean` of mit-pdos/perennial), including the Goose
# translator that produced `Code/` and `GeneratedProof/` (checked by
# `etc/goose.py --check`).
[[require]]
name = "perennial"
git = "https://github.com/mit-pdos/perennial"
rev = "f8b35ddbf1cc852c0790739abda7028ae41bbe65"

# Everything here, laid out by kind and then by Go package path:
#   Code/<pkg>, GeneratedProof/<pkg>  the Goose translations of etcd-raft and of etcd's
#                                     cache package, generated by `etc/goose.py`; do
#                                     not edit by hand
#   Spec/<pkg>/<fn>                   the Hoare triple of a Go function of package <pkg>
#   Proof/<pkg>/<fn>                  its proof; Proof/go_etcd_io/raft/v3/ also holds
#                                     the Raft proof's shared definitions, Link, Results,
#                                     and Proof/go_etcd_io/etcd/cache/v3/ the cache's
[[lean_lib]]
name = "EtcdGrove"
globs = ["Code.+", "GeneratedProof.+", "Spec.+", "Proof.+"]

[leanOptions]
linter.unusedSectionVars = false
