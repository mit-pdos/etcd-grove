name = "etcdGrove"
defaultTargets = ["EtcdGrove"]

# The Perennial framework, including the Goose translator that produced `Code/` and
# `GeneratedProof/` (checked by `etc/goose.py --check`). The pin follows branch `lean` of
# mit-pdos/perennial (notes/STATUS.md, "Perennial: the pin follows `lean`").
[[require]]
name = "perennial"
git = "https://github.com/mit-pdos/perennial"
rev = "864598b33b026160fafe26678b6665d677b4891d"

# Everything here, laid out by kind and then by Go package path:
#   Code/<pkg>, GeneratedProof/<pkg>  the Goose translations of raft and of etcd's
#                                     cache package and server, generated by
#                                     `etc/goose.py`; do not edit by hand
#   Spec/<pkg>/<fn>                   the Hoare triple of a Go function of package <pkg>
#   Proof/<pkg>/<fn>                  its proof; Proof/go_etcd_io/raft/v3/ also holds
#                                     the Raft proof's shared definitions, Link, Results,
#                                     Proof/go_etcd_io/etcd/cache/v3/ the cache's and
#                                     Proof/go_etcd_io/etcd/server/v3/etcdserver/ the
#                                     server's
[[lean_lib]]
name = "EtcdGrove"
globs = ["Code.+", "GeneratedProof.+", "Spec.+", "Proof.+"]

[leanOptions]
linter.unusedSectionVars = false
