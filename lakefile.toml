name = "etcdGrove"
defaultTargets = ["EtcdGrove", "RaftTla", "RaftWitness", "RaftNoAx", "PorcupineDag", "Bbolt", "WalTester", "SpecPlan", "Robustness", "Net", "KvNet", "Dsverify"]

# The Perennial framework, including the Goose translator that produced `Code/` and
# `GeneratedProof/` (checked by `etc/goose.py --check`). The pin follows branch `lean` of
# mit-pdos/perennial (notes/STATUS.md, "Perennial: the pin follows `lean`").
[[require]]
name = "perennial"
git = "https://github.com/mit-pdos/perennial"
rev = "b3f2fc48513a9f8c0ad3028670441a1511a975f6"

# Everything here, laid out by kind and then by Go package path:
#   Code/<pkg>, GeneratedProof/<pkg>  the Goose translations of raft and of etcd's
#                                     cache package and server, generated by
#                                     `etc/goose.py`; do not edit by hand
#   TrustedCode/<pkg>, ManualProof/<pkg> the models of a translation's `trusted` declarations
#                                     (trusted), and the module its generated proof imports
#   Spec/<pkg>/<fn>                   the Hoare triple of a Go function of package <pkg>
#   Proof/<pkg>/<fn>                  its proof; Proof/go_etcd_io/raft/v3/ also holds
#                                     the Raft proof's shared definitions, Link, Results,
#                                     Proof/go_etcd_io/etcd/cache/v3/ the cache's and
#                                     Proof/go_etcd_io/etcd/server/v3/etcdserver/ the
#                                     server's
#   GooseLang/Ext/<Name>, Proof/<Name>Prelude  this repository's GooseLang extensions
#                                     (trusted), as Perennial's
[[lean_lib]]
name = "EtcdGrove"
globs = ["Code.+", "TrustedCode.+", "GeneratedProof.+", "ManualProof.+", "Spec.+", "Proof.+",
         "GooseLang.+"]

# Raft's `with_tla` build (`state_trace.go`: the trace hooks with their bodies), for raft's TLA+ trace
# validation (examples/raft/tracecheck) and nothing else: the main tree translates and verifies the
# build without the tag, the one etcd ships. RaftTla/{Code,GeneratedProof}/ are etc/goose.py's
# projects raft-tla (raft's own package) and tracecheck (the harness); RaftTla/{Spec,Proof}/ are the
# main tree's specs and proofs of raft, copied by etc/gen-raft-tla.py (the files with its marker:
# one proof source, compiled against both builds), and the hand-written modules specific to the
# build (the logger's contract, the hooks' proofs, the package initializer) and to the trace check.
# It imports the main tree, but not its raft, and nothing outside it imports it: its modules declare
# the main raft's names.
[[lean_lib]]
name = "RaftTla"
globs = ["RaftTla.+"]

# The witness experiment (notes/raft-witness.md): raft with witness support (a candidate for
# etcd-io/raft#133) and the key-value store on it, in a parallel tree with the same layout
# (RaftWitness/{Code,TrustedCode,GeneratedProof,ManualProof,Spec,Proof}/, translated by
# etc/goose.py's projects raft-witness and kvwitness). It imports the main tree, but not its raft
# or kv, and nothing outside it imports it: its modules declare the main raft's names.
[[lean_lib]]
name = "RaftWitness"
globs = ["RaftWitness.+"]

# Raft without hand-written axioms (notes/raft-noax-part.md): the raft proof and kvdurable's closed
# theorem over a raft of its own (etc/goose.py's projects raft-noax and kvdurable-noax), in a
# parallel tree with the same layout (RaftNoAx/{Code,TrustedCode,GeneratedProof,ManualProof,Spec,
# Proof}/; the copies of the main tree's modules written by etc/copy-part.py). It imports the main
# tree, but not its raft or kvdurable, and nothing outside it imports it: its modules declare the
# main raft's names.
[[lean_lib]]
name = "RaftNoAx"
globs = ["RaftNoAx.+"]

# porcupine's pull request #46 (the DAG search; notes/porcupine-dag-plan.md), vendored in
# third_party/porcupine-dag and translated by etc/goose.py's project porcupine-dag into a parallel
# tree with the same layout (PorcupineDag/{Code,GeneratedProof,Spec,Proof}/): the Go path is
# v1.3.1's, so its modules declare the main porcupine's names; nothing outside it imports it.
[[lean_lib]]
name = "PorcupineDag"
globs = ["PorcupineDag.+"]

# The spec plan (notes/specs-only/README.md): intermediate specs for all of etcd over opaque
# predicates, without proofs, judged against the Go requirement snippets of examples/specreq/; the
# real proofs (Spec/, Proof/) converge toward them (CLAUDE.md, "The spec plan and convergence").
# SpecPlan/Spec/<pkg>/, modules SpecPlan.Spec.*: it imports only the shared translations
# (GeneratedProof, GooseLang) and Perennial, and nothing outside it imports it (its namespaces are
# the main tree's). A default target (3238 modules, about 2h20m of CPU, measured 2026-11-12);
# etc/specs-build.sh builds a few of its modules.
[[lean_lib]]
name = "SpecPlan"
globs = ["SpecPlan.+"]

# bbolt's top-level test (examples/bbolt/bank) and bbolt itself with its bodies (the fork
# upamanyus/bbolt, branch goose-lean), translated by etc/goose.py's projects bbolt and bbolttest
# into a parallel tree with the same layout (Bbolt/{Code,GeneratedProof,Spec,Proof}/): the main
# tree translates go.etcd.io/bbolt names-only, for etcd, so the two declare the same names;
# nothing outside Bbolt imports it. Its file calls are the Linux file extension's (project
# bboltfs's `os`, `syscall`, `golang.org/x/sys/unix`).
[[lean_lib]]
name = "Bbolt"
globs = ["Bbolt.+"]

# etcd's WAL tester (examples/etcd/wal) and examples/lib/durable with its bodies over the per-byte
# file extension (notes/wal-lean-integration.md), translated by etc/goose.py's project etcd-wal and
# project durable's part into a parallel tree (WalTester/{Code,GeneratedProof,Spec,Proof}/): the
# main tree keeps durable trusted over durableExt (kvdurable's), so the two declare the same names;
# nothing outside WalTester imports it. (Until 2026-11-15 they were in the part LinuxFs/, with the
# WAL and the file layer, now the main tree's.)
[[lean_lib]]
name = "WalTester"
globs = ["WalTester.+"]

# Robustness theorems (notes/robustness.md): the statement of a deployed system's robustness --
# in every execution (Perennial's DistCrashNsteps) of programs on machines that crash and restart
# and programs on machines that never crash, with whatever extensions are plugged in, no thread is
# stuck or has a top-level panic. Used by the examples' statements (raft/kvnet); its Go counterpart
# is the test harness examples/lib/robust.
[[lean_lib]]
name = "Robustness"
globs = ["Robustness.+"]

# The net extension's `net` (`GooseLang/Ext/Net`, notes/net-tcp.md) with the programs proved over
# it (examples/net/), in a parallel tree with the same layout
# (Net/{Code,TrustedCode,GeneratedProof,ManualProof,Spec,Proof}/; etc/goose.py's project
# net). Since the net swap (etcd-dist D2, 2026-11-22) the main tree's `net` is this one (`net=Net`):
# the main tree imports Net's `net` modules (`Net/{Code,TrustedCode,GeneratedProof,ManualProof}/net`,
# `Net/{Spec,Proof}/net/`), not the rest of the part (its copies of the main tree's initializers).
[[lean_lib]]
name = "Net"
globs = ["Net.+"]

# kvnet's proof (notes/kvnet-part.md): the networked key-value store (examples/raft/kvnet, etc/goose.py's
# project kvnet) over raft-noax's raft, the net extension's `net` and the bodied `durable` over fsExt,
# which the parts RaftNoAx, Net and WalTester each declare under main-tree names, so no other tree can
# import them together. KvNet/{Code,GeneratedProof}/ are the parts of projects raft-noax, net, durable
# and etcd (walpb) translated into it and kvnet's own; its copies of those parts' (and the main tree's)
# modules that its closure needs are written by etc/copy-part.py, its initializers by etc/gen-init.py.
# Nothing outside KvNet imports it.
[[lean_lib]]
name = "KvNet"
globs = ["KvNet.+"]

# The dsverify kits ported onto the net extension (notes/dsverify-net-port-plan.md, phase 6;
# notes/dsv-paxos.md): each kit's Go (etc/goose.py's project dsv-<kit>) and proof, over the part
# Net's `net` and remote, the main tree's lintest and porcupine. Nothing outside Dsverify imports it.
[[lean_lib]]
name = "Dsverify"
globs = ["Dsverify.+"]

# The Lean certification of the TCP conformance checker's witnesses
# (examples/net/conform/check/README.md, "Certification in Lean"): replays a witness and the run's
# traced calls through the proved deciders of GooseLang/Ext/Net/Decide.lean.
[[lean_exe]]
name = "net-replay"
root = "GooseLang.Ext.Net.Replay"

[leanOptions]
linter.unusedSectionVars = false
