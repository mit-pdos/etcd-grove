# The copy for the part `KvNet/` of `RaftNoAx/Code/go_etcd_io/etcd/server/v3/storage/wal/walpb.toml` (etc/copy-part.py; rerun it, do not edit).
# The WAL's records (project etcd's part `LinuxFs/`), protobuf-go v2 as raftpb
# (Code/go_etcd_io/raft/v3/raftpb.toml): record.go and record.pb.go's getters with bodies; the
# protobuf runtime plumbing names only (`ProtoReflect`, `Descriptor`, `Reset`, `String`, the file
# descriptor and its initialization).
translate = ["*",
  "!*.ProtoReflect", "!*.Descriptor", "!*.Reset", "!*.String",
  "!file_record_proto*", "!File_record_proto", "!init.*"]
imports = ["!*", "errors", "fmt", "go.etcd.io/raft/v3/raftpb", "google.golang.org/protobuf/proto",
  "google.golang.org/protobuf/runtime/protoimpl",
  "google.golang.org/protobuf/reflect/protoreflect"]
# (2026-11-14, the decoder's `rec.Reset()`; pending the user's review) `(*Record).Reset` trusted
# (TrustedCode/go_etcd_io/etcd/server/v3/storage/wal/walpb.lean): the fields' reset; the
# message-state store, protobuf runtime plumbing, left out (the model's docstring says why that is
# faithful)
# (etcd-grove#32, 2026-11-22) the `init` function (the file descriptor's registration) trusted:
# a model that does nothing (TrustedCode/go_etcd_io/etcd/server/v3/storage/wal/walpb.lean; until then names-only, the axiom `initFuncsOk`)
trusted = ["Record.Reset", "init.0"]

# translate the definitions of all type declarations goose supports
translate_types = true

# --- skipped package variables (mit-pdos/etcd-grove#23) ---
# Not translated: no Lean name, no initializer, no allocation (goose `[[skip]]`; until 2026-11-22
# their initializers were untranslated, `opaqueInitsOk`). goose refuses a reference to one from
# translated code, so no verified code reads them; each reason says why not running the
# initializer is unobservable.
[[skip]]
names = ["file_record_proto_msgTypes", "file_record_proto_goTypes", "file_record_proto_depIdxs"]
reason = """
Literals: composite literals, conversions and allocations (`make`, `new`, `&T{}`) of constants,
function values (built, not called) and other package variables' values or addresses, with no call.
Each terminates, cannot panic (its sizes, indices and keys are constants the compiler checks) and
has no effect beyond its variable."""
# --- end of skipped package variables ---
