# The copy for the part `KvNet/` of `Net/Code/net/http.toml` (etc/copy-part.py; rerun it, do not edit).
# Project models-net's net/http (etc/goose.py): the net/http model (models/net/http, Go 1.27.3's
# source with the HTTP/1.x head parser replaced, chunked bodies, TLS, HTTP/2 and the Transport not
# modelled; models/README.md). Not the whole package: goose takes it all with its bodies (checked
# 2026-11-20: four Go 1.27.3 declarations it refused are changed in the model, marked MODEL), but
# that is 4.4 MB of Lean importing most of the standard library. Translated with their bodies: the
# model's head parser (textproto_model.go), and what net/rpc's HTTP path runs (phase 5.2's Lean
# half, 2026-11-20): `ReadResponse` (DialHTTPPath's CONNECT answer), `Handle` and the ServeMux's
# registration and dispatch, `Serve`/`ListenAndServe` and the server's connection loop up to a
# hijack (`conn.serve`, `readRequest`, `Hijack`, the response writer's header and status). The
# rest: types and names (an untranslated function is an `opaque` constant). The imports are the
# packages these bodies call (crypto/tls for a type assertion; the vendored httpguts through the
# forwarding module Net/Code/golang_org/x/net/http/httpguts.lean).
translate = ["!*", "modelReadLine", "modelReadMIMEHeader", "trimLine", "errMessageTooLarge",
             "notModelled", "notModelled.*", "modelChunked", "Method*", "Status*", "!StatusText",
             "ReadResponse", "Handle", "ServeMux.Handle", "ServeMux.register", "ServeMux.registerErr",
             "ServeMux.ServeHTTP", "ServeMux.Handler", "ServeMux.findHandler", "ServeMux.matchOrRedirect",
             "Serve", "ListenAndServe", "Server.Serve", "Server.ListenAndServe", "Server.newConn",
             "conn.serve", "conn.readRequest", "conn.hijacked", "conn.hijackLocked", "response.Hijack",
             "response.Header", "response.WriteHeader", "response.Write", "response.write",
             "serverHandler.ServeHTTP", "DefaultServeMux", "defaultServeMux"]
imports = ["!*", "errors", "fmt", "io", "bufio", "net", "net/url", "net/textproto", "strings",
           "strconv", "sync", "sync/atomic", "time", "context", "path", "runtime",
           "crypto/tls", "vendor/golang.org/x/net/http/httpguts", "golang.org/x/net/http/httpguts",
           "mime/multipart", "log"]

# translate the definitions of all type declarations goose supports
translate_types = true
