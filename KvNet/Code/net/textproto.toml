# The copy for the part `KvNet/` of `Net/Code/net/textproto.toml` (etc/copy-part.py; rerun it, do not edit).
# Project models-net (etc/goose.py): `net/textproto`, names and types only (the net/http model's
# server and `ReadResponse` call `CanonicalMIMEHeaderKey` and name `MIMEHeader`, `ProtocolError`;
# the model's head parser, `models/net/http/textproto_model.go`, replaces what they would read).
# With their bodies (2026-11-23): `CanonicalMIMEHeaderKey`'s quick check and `MIMEHeader.Del`, which
# net/http's `Header.Del` runs (readTransfer's `fixLength` deletes "Content-Length").
# `ProtocolError.Error` (2026-11-23): net/http's `readRequestLimit` calls `Error()` on the header reader's errors.
translate = ["!*", "CanonicalMIMEHeaderKey", "validHeaderFieldByte", "MIMEHeader.Del", "ProtocolError.Error"]
imports = ["!*"]
translate_types = true
