schema_version: "1.1"
name: raft-node-propose
expected_outcome: |
  A findings report on node.Propose's spec, judged as its clients (etcd's server, examples/kv)
  and a reader of interface/ see it. Known answer key (2026-10-26 review):
  - rLog, propIs and entDataIs expose their ghost-state bodies (ghostVar on reRLog, reProps,
    savedPredOwn) where they should be sealed with laws;
  - a missing law, "rLog L and isCommitted l give l a prefix of L": examples/kv's kv_log_prefix
    and the server's InvRequest each prove it by opening raft's internal commit invariant;
  - the spec states its atomic update through the wrapper propArg, hiding the contract;
  - data ≠ [] is an undocumented scope restriction (Go accepts empty proposals; the spec reserves
    empty entries for raft's own).
  And it should keep what is right: the logically atomic update over the committed log, no promise of
  commitment on nil (faithful to Go), the data slice made read-only (Go aliases the buffer).
