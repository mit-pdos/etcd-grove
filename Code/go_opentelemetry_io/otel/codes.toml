# Types only: the types of `trace.Span`'s method parameters, so that Goose translates
# `trace.Span` as an interface (mvcc's watchStream.Watch stores a span in a local variable).
# (prove-smallinits, 2026-11-20) the map literals `codeToStr` and `strToCode` and the codes they
# name (until then `opaqueInitsOk`).
translate = ["!*", "codeToStr", "strToCode", "Unset", "Error", "Ok"]
imports = ["!*"]

# translate the definitions of all type declarations goose supports
translate_types = true
