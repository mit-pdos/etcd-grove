# Types and names only: function and method bodies are axiomatized (project k8s-apiserver;
# notes/k8s-etcd3-goose.md). The names are the encoding/json model's (models/encoding/json, a
# standard-library model: the std_models of the projects that map encoding/json here; its exported
# names are Go 1.27.3's encoding/json's, plus the codec registry `Codec`, `SetCodec`), so that the
# specs over the model's registered codec can be stated in the main tree before the bodies are
# translated (mit-pdos/etcd-grove#24, item 1).
translate = ["!*"]
imports = ["!*"]

# translate the definitions of all type declarations goose supports
translate_types = true
