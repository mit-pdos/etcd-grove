# Types and names only: function and method bodies are axiomatized. Imports `io`, so that the
# interface `Hash` (which embeds `io.Writer`) is translated rather than axiomatized (pr
# etcd#22125: what `crypto/sha256.New` returns).
translate = ["!*"]
imports = ["!*", "io"]

# translate the definitions of all type declarations goose supports
translate_types = true
