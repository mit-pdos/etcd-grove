# Types and names only: function and method bodies are axiomatized.
# The log-level constant `DebugLevel` (zap's `DebugLevel` is it; the auth plan's S5, 2026-10-24).
# (2026-11-20, prove-zap) the levels zap's leveled methods use and the `FieldType`s its field
# constructors set.
# (prove-misc, 2026-11-20) the package's initializer translated whole (until then the
# trust-boundary axioms `opaqueInitsOk` and `initFuncsOk`): its variables (the pools, `pool.New` of
# zap's internal `pool`; the interface assertions; the level colors and their strings) and its
# `init` (`level_strings.go`: each level's color formatted, `Level.String`/`CapitalString`).
translate = ["!*", "DebugLevel", "InfoLevel", "WarnLevel", "ErrorLevel",
  "DPanicLevel", "PanicLevel", "FatalLevel",
  "ArrayMarshalerType", "BoolType", "ByteStringType", "DurationType", "Int64Type", "Int32Type",
  "StringType", "StringerType", "Uint64Type", "Uint32Type", "ErrorType", "SkipType",
  "DefaultClock", "_sliceEncoderPool", "_", "_cePool", "_errArrayElemPool", "_jsonPool",
  "nullLiteralBytes", "errUnmarshalNilLevel", "_levelToColor", "_unknownLevelColor",
  "_levelToLowercaseColorString", "_levelToCapitalColorString", "init.0",
  "Level.String", "Level.CapitalString",
  # (prove-initleft, 2026-11-21) what `zap.NewNop` calls (zap's `_globalL = NewNop()`)
  "NewNopCore", "AddSync",
  # (zap-z1, 2026-11-23) what `zap.Logger.check` runs (until then the trust boundary): the no-op
  # core's methods, the level enabler and the system clock. (`CheckedEntry.Write` stays names only:
  # its `putCheckedEntry` reaches zap's generic `pool.Pool[T].Put`, whose translation passes `x : T` to
  # `sync.Pool.Put(any)` without converting it to an interface, notes/perennial-changes.md.)
  "nopCore.Enabled", "nopCore.With", "nopCore.Check", "nopCore.Write", "nopCore.Sync",
  "Level.Enabled", "systemClock.Now",
  # (zap-z2, 2026-11-23) `CheckedEntry.Write` (until then the trust boundary; Perennial's goose now
  # converts zap's generic `pool.Pool[T].Put(x)` argument to `any`), and what `Panic`/`Fatal`'s entry
  # runs: `After` (a fresh entry from `_cePool`), its terminal hooks (`CheckWriteAction.OnWrite`)
  "CheckedEntry.Write", "CheckedEntry.After", "CheckedEntry.reset", "getCheckedEntry",
  "putCheckedEntry", "CheckWriteAction.OnWrite",
  "WriteThenNoop", "WriteThenGoexit", "WriteThenPanic", "WriteThenFatal"]
imports = ["!*", "time", "io", "errors", "fmt", "sync", "go.uber.org/zap/internal/pool",
  "go.uber.org/zap/internal/color",
  # (zap-z2) what `CheckedEntry.Write` and `CheckWriteAction.OnWrite` call: `multierr.Append` (names
  # only, on the cores' errors: no core here), `runtime.Goexit` (`WriteThenGoexit`), zap's
  # `internal/exit` (`WriteThenFatal`)
  "go.uber.org/multierr", "runtime", "go.uber.org/zap/internal/exit"]

# translate the definitions of all type declarations goose supports
translate_types = true
