# Types and names only: function and method bodies are axiomatized. (The cache needs the
# type of `clientv3.Client`'s field `lg`, `atomic.Pointer[zap.Logger]`.)
# The log-level constant `DebugLevel` (the auth plan's S5, 2026-10-24: `auth.authStore.Authenticate`
# calls `lg.Check(zap.DebugLevel, ...)`; an untranslated constant is a value of unknown shape, which
# a proof cannot step past).
translate = ["!*", "DebugLevel"]
# zapcore so that the generic `anyFieldC[T]` (a function type returning `zapcore.Field`) is
# translated: Goose emits an axiomatized generic type as `∀ (T : go.type), go.type`, which
# does not elaborate (the Lean name is go.GoType).
imports = ["!*", "go.uber.org/zap/zapcore"]

# translate the definitions of all type declarations goose supports
translate_types = true
