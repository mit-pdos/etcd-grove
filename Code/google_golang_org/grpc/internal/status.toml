# (status-bodies, 2026-11-25) With bodies: the constructor and the accessors the status slice's
# specs are proved over (`New`, `Status.Code`/`Message`/`Err`/`String`, `Error.Error`/`GRPCStatus`/
# `Is`), and the types `Status` (of which `grpc/status.Status` is an alias) and `Error`. Until then
# names only.
translate = ["!*", "Status", "Error", "New", "Status.Code", "Status.Message", "Status.Err",
  "Status.String", "Error.Error", "Error.GRPCStatus", "Error.Is"]
imports = ["!*", "fmt", "google.golang.org/genproto/googleapis/rpc/status",
  "google.golang.org/grpc/codes", "google.golang.org/protobuf/proto"]

# translate the definitions of all type declarations goose supports
translate_types = true
