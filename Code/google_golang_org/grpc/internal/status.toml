# Names only: the type `Status` (of which `grpc/status.Status` is an alias, for
# `client/v3/leasing`). (phase 7 S2 core, 2026-11-23, notes/phase7-plan.md §0a) With its body,
# `IsRestrictedControlPlaneCode` (the client attempt's `createHeaderFields` calls it on a per-RPC
# credentials' status error), over `Status.Code`'s trust-boundary spec; hence the import of `codes`.
translate = ["!*", "IsRestrictedControlPlaneCode"]
imports = ["!*", "google.golang.org/grpc/codes"]
