# (phase7-inits, 2026-11-25, notes/phase7-endstate.md §4; first phase 7 S2 core, 2026-11-23, for
# `FromOutgoingContextRaw`) Names only, but the hook variables (`internal.go`, `experimental.go`: no
# initializers) that the translated `init`s of grpc (`dialoptions.go`, `rpc_util.go`, `server.go`),
# `codes` and `metadata` set: their allocations. Only `FromOutgoingContextRaw` is read by
# translated code (grpc's `metadataFromOutgoingContextRaw`); the others are written only (their readers
# are tests and packages outside the model: xds, stats/opentelemetry, orca, experimental), each cell in
# an init-time invariant (`grpc/internal/Hooks.lean`).
translate = ["!*", "FromOutgoingContextRaw",
  # grpc's `init`s
  "AddGlobalDialOptions", "ClearGlobalDialOptions", "AddGlobalPerTargetDialOptions",
  "ClearGlobalPerTargetDialOptions", "JoinDialOptions", "DisableGlobalDialOptions",
  "AcceptCompressors", "GetServerCredentials", "IsRegisteredMethod", "ServerFromContext",
  "AddGlobalServerOptions", "ClearGlobalServerOptions", "JoinServerOptions", "XDSFilterWrapperOption",
  # `codes`'
  "CanonicalString"]
imports = ["!*"]

# translate the definitions of all type declarations goose supports (its interfaces, which name no
# other package; `HealthChecker` names `context` and `connectivity`, not imported: axiomatized)
translate_types = true

# --- skipped package variables (mit-pdos/etcd-grove#23) ---
# Not translated: no Lean name, no initializer, no allocation (goose `[[skip]]`). goose refuses a
# reference to one from translated code, so no verified code reads them.
[[skip]]
names = ["KeepaliveMinPingTime", "KeepaliveMinServerPingTime", "GRPCResolverSchemeExtraMetadata",
  "UserSetDefaultScheme", "TimeAfterFunc", "NewStreamWaitingForResolver",
  "AsyncReporterCleanupDelegate"]
reason = """
Literals: constants, constant expressions (`10 * time.Second`) and function literals (built, not
called), with no call. Each terminates, cannot panic and has no effect beyond its variable."""
