# (item 5, client construction) `insecure.NewCredentials`, the transport credentials `clientv3`'s
# `dialSetupOpts` dials with when the client has none. (prove-grpcsmall, 2026-11-20) With its body
# (`insecureTC{}` as `credentials.TransportCredentials`): the type `insecureTC` translated, and
# `credentials` imported for the interface it converts to.
translate = ["!*", "NewCredentials"]
imports = ["!*", "google.golang.org/grpc/credentials"]

# translate the definitions of all type declarations goose supports
translate_types = true
