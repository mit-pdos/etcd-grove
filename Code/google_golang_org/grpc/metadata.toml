# Types and names only: the incoming metadata's type `MD` (`map[string][]string`), whose
# entries the auth store's `AuthInfoFromCtx` reads (`FromIncomingContext` is names only: an
# axiom, `Spec/google_golang_org/grpc/metadata/FromIncomingContext.lean`; unit P2). `MD.Get` has
# its body (its `wp_proof` a theorem over `strings.ToLower`'s spec, 2026-11-18). (prove-grpcext, 2026-11-20)
# `loggableMetadataKeys`, a map literal: its initializer translated (`etc/gen-init.py` proves it).
# (phase 7 S2 core, 2026-11-23, notes/phase7-plan.md §0a) its `init` (`internal.FromOutgoingContextRaw
# = fromOutgoingContextRaw`) and `fromOutgoingContextRaw` with their bodies (until then `initFuncsOk`):
# grpc's `metadataFromOutgoingContextRaw` asserts the variable's type, and the client attempt's
# `createHeaderFields` calls it; hence the imports of grpc's `internal` and of `context`.
translate = ["!*", "MD.Get", "loggableMetadataKeys", "init.0", "fromOutgoingContextRaw"]
imports = ["!*", "strings", "context", "google.golang.org/grpc/internal"]

# translate the definitions of all type declarations goose supports
translate_types = true
