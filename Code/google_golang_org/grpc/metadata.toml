# Types and names only: the incoming metadata's type `MD` (`map[string][]string`), whose
# entries the auth store's `AuthInfoFromCtx` reads (`FromIncomingContext` is names only: an
# axiom, `Spec/google_golang_org/grpc/metadata/FromIncomingContext.lean`; unit P2).
translate = ["!*"]
imports = ["!*"]

# translate the definitions of all type declarations goose supports
translate_types = true
