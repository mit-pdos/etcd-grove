# Types and names only: the type of `clientv3.Client`'s field `creds`
# (`TransportCredentials`); (unit P3a) the interface `PerRPCCredentials`, which etcd's client's
# `credentials.PerRPCCredentialsBundle` names (its `GetRequestMetadata` takes a `context.Context`:
# hence the import of `context`); (item 5, client construction) `TransportCredentials` as an
# interface, whose handshakes name `net.Conn`: hence the import of `net`.
translate = ["!*"]
imports = ["!*", "context", "net"]

# translate the definitions of all type declarations goose supports
translate_types = true
