# Names only (item 4, the server start): grpc's health service, which `v3rpc.Server` registers
# (`NewServer`, `Server.SetServingStatus`). Its types are translated (importing their field types'
# packages), so that an implementation can allocate a `Server` (etcd-refimpl's reference
# implementation).
# (phase7-inits, 2026-11-25) `logger` (`grpclog.Component("health_service")`, `logging.go:23`) with its
# initializer (until then `opaqueInitsOk`), and its two `init`s with their bodies (until then
# `initFuncsOk`): `client.go`'s (`internal.HealthCheckFunc = clientHealthCheck`) and `producer.go`'s
# (`producerBuilderSingleton = &producerBuilder{}`, `internal.RegisterClientHealthCheckListener =
# registerClientSideHealthCheckListener`); hence the imports of `grpclog`, grpc's `internal` and of
# `context` and `connectivity` (`clientHealthCheck`'s type).
translate = ["!*", "logger", "init.0", "init.1", "producerBuilderSingleton"]
imports = ["!*", "sync", "google.golang.org/grpc/health/grpc_health_v1", "google.golang.org/grpc/grpclog",
  "google.golang.org/grpc/internal", "context", "google.golang.org/grpc/connectivity",
  # `registerClientSideHealthCheckListener`'s type names `balancer.SubConn` and `SubConnState`
  "google.golang.org/grpc/balancer"]

# translate the definitions of all type declarations goose supports
translate_types = true

# --- skipped package variables (mit-pdos/etcd-grove#23) ---
# Not translated: no Lean name, no initializer, no allocation (goose `[[skip]]`; until 2026-11-22
# their initializers were untranslated, `opaqueInitsOk`). goose refuses a reference to one from
# translated code, so no verified code reads them; each reason says why not running the
# initializer is unobservable.
[[skip]]
names = ["backoffStrategy", "backoffFunc"]
reason = """
Literals: composite literals, conversions and allocations (`make`, `new`, `&T{}`) of constants,
function values (built, not called) and other package variables' values or addresses, with no call.
Each terminates, cannot panic (its sizes, indices and keys are constants the compiler checks) and
has no effect beyond its variable."""
# --- end of skipped package variables ---
