# Types and names only, with the constants `OK` and `FailedPrecondition`
# (`clientv3.WatchResponse.Err` passes `FailedPrecondition`, `status.Error`'s spec rules out `OK`;
# `client/v3/leasing` passes `Unimplemented` and compares with `Unavailable`; the server's
# `v3rpc.togRPCError` passes `Unknown`; unit C1: `clientv3.ContextError` compares with
# `DeadlineExceeded` and `Canceled`; the watch slice's unit W-C: `clientv3.isHaltErr` compares with
# `Unavailable` and `Internal`).
translate = ["!*", "OK", "Unknown", "FailedPrecondition", "Unavailable", "Unimplemented",
  "DeadlineExceeded", "Canceled", "Internal",
  # (prove-smallinits, 2026-11-20) `strToCode`, a map literal of the codes (until then
  # `opaqueInitsOk`), and the codes it names
  "strToCode", "InvalidArgument", "NotFound", "AlreadyExists", "PermissionDenied",
  "ResourceExhausted", "Aborted", "OutOfRange", "DataLoss", "Unauthenticated",
  # (phase7-inits, 2026-11-25) its `init` (`code_string.go`: `internal.CanonicalString =
  # canonicalString`) with its body (until then `initFuncsOk`); hence the import of grpc's `internal`
  "init.0",
  # (status-bodies, 2026-11-25) `Code.String` (`code_string.go`), with its body: what
  # `internal/status.Status.String` formats (`%s` of the code)
  "Code.String"]
imports = ["!*", "google.golang.org/grpc/internal", "strconv"]

# translate the definitions of all type declarations goose supports
translate_types = true
