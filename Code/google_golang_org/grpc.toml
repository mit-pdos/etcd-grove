# Types and names only: the types of `clientv3.Client`'s fields `conn` (`*ClientConn`) and
# `callOpts` (`[]CallOption`), and of `clientv3.Config.DialOptions`; and (unit C1, the client
# meets the server) the interface `ClientConnInterface`, the type of the generated KV stub's
# `cc` field (`etcdserverpb.kVClient`), whose `Invoke` names `context.Context`: hence the import
# of `context`, without which the interface is axiomatized.
translate = ["!*"]
imports = ["!*", "context"]

# translate the definitions of all type declarations goose supports
translate_types = true
