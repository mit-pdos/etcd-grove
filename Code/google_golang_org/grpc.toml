# Types and names only: the types of `clientv3.Client`'s fields `conn` (`*ClientConn`) and
# `callOpts` (`[]CallOption`), and of `clientv3.Config.DialOptions`; and (unit C1, the client
# meets the server) the interface `ClientConnInterface`, the type of the generated KV stub's
# `cc` field (`etcdserverpb.kVClient`), whose `Invoke` names `context.Context`: hence the import
# of `context`, without which the interface is axiomatized. (const-inits, 2026-11-19) `EnableTracing`
# (`var EnableTracing bool`, no initializer) translated: its allocation, the package fact's cell.
# (prove-smallinits, 2026-11-20) the call options `clientv3.defaultCallOpts` holds: `WaitForReady`,
# `MaxCallSendMsgSize`, `MaxCallRecvMsgSize` (struct literals of one scalar field).
# (prove-grpcsmall, 2026-11-20) `StaticMethod` and `Peer` (`rpc_util.go`), with their bodies (struct
# literals of the call options): `Peer`'s option holds a `*peer.Peer`, hence the import of `peer`.
# (prove-grpcext, 2026-11-20) the generic stream wrappers' methods etcd calls, with their bodies
# (`GenericClientStream.{Send,Recv}`, `GenericServerStream.{Send,Recv}`) and promoted ones
# (`GenericClientStream.{CloseSend,Context}`, `GenericServerStream.Context`): their specs' axioms are theorems.
translate = ["!*", "EnableTracing", "WaitForReady", "MaxCallSendMsgSize", "MaxCallRecvMsgSize",
  "StaticMethod", "Peer",
  "GenericClientStream.Send", "GenericClientStream.Recv", "GenericServerStream.Send",
  "GenericServerStream.Recv", "GenericClientStream.CloseSend", "GenericClientStream.Context",
  "GenericServerStream.Context",
  # (grpcdriver, 2026-11-24) the client-streaming wrappers gRPC's robustness driver calls, with their
  # bodies (`GenericClientStream.CloseAndRecv`: `CloseSend`, then `RecvMsg` into a new reply;
  # `GenericServerStream.SendAndClose`: `SendMsg`)
  "GenericClientStream.CloseAndRecv", "GenericServerStream.SendAndClose",
  # (phase 7 S1, 2026-11-21, notes/phase7-plan.md; grpc is the model's since S0) the server
  # option constructors that only store a closure, with their bodies, and the closures' holder (the
  # dial options' come with `dialOptions`, whose fields need more of grpc's packages)
  "newFuncServerOption", "funcServerOption.apply", "KeepaliveEnforcementPolicy", "MaxRecvMsgSize",
  "MaxSendMsgSize", "MaxConcurrentStreams", "ChainUnaryInterceptor", "ChainStreamInterceptor",
  # (phase 7 S1, dial side, 2026-11-22) the dial options etcd's client sets, and their holder
  "newFuncDialOption", "funcDialOption.apply", "WithTransportCredentials", "WithPerRPCCredentials",
  "WithUnaryInterceptor", "WithStreamInterceptor", "WithResolvers",
  # (putget-dist interim, 2026-11-24, notes/putget-dist-plan.md section 12, F1) `WithNoProxy`, which
  # etcdstart's `NewClients` passes: its closure sets `useProxy` false
  "WithNoProxy",
  # (phase7-inits, 2026-11-25, notes/phase7-endstate.md §4) its `init`s with their bodies (until then
  # `initFuncsOk`): `dialoptions.go`'s, `rpc_util.go`'s and `server.go`'s, which store function values
  # in `internal`'s hook variables; and the variables their closures append to (no initializers)
  "init.0", "init.1", "init.2", "globalDialOptions", "globalPerTargetDialOptions",
  "globalServerOptions",
  # (phase7-inits, batch 2) `logger` (`grpclog.Component("core")`, `server.go:101`) with its
  # initializer (until then `opaqueInitsOk`)
  "logger",
  # (phase 7 S2 core, 2026-11-23, notes/phase7-plan.md §0a; W1, 2026-11-26) the client attempt's
  # wire, bottom-up:
  # the model's frame writers (`model_wire.go`) and the header list's limit (F1)
  "headerListTooLarge", "appendHeaderBlock", "appendOversizedBlock", "appendData", "appendReset",
  "maxHeaderBlock", "frameHead", "frameData", "frameClose", "frameCancel", "frameHeader",
  "frameTrailer", "frameReset", "frameSettings", "clientPreface", "errCodeRefusedStream",
  # (phase 7 S2 core, 2026-11-23) the package variables the client attempt's code reads, with their
  # initializers (until then `[[skip]]`): `errors.New` of constants, `status.Error` of a constant
  # code and message, slice literals of the codes
  "errMalformedFrame", "errStreamDone", "errHeaderListTooLarge", "ErrClientConnClosing",
  "transportFailureCodes", "http2ErrConvTab",
  # (phase 7 S2 core, 2026-11-23) `metadataFromOutgoingContextRaw`, the type assertion of
  # `internal.FromOutgoingContextRaw`, which `metadata`'s translated `init` sets (`metadata`'s fact)
  "metadataFromOutgoingContextRaw",
  # (phase 7 S2 core, 2026-11-23) `createHeaderFields`' helpers of the model's `model_http_util.go`
  # (grpc-go's `http_util.go`): `isReservedHeader`, `encodeMetadataHeader` (`-bin` values in base64)
  "isReservedHeader", "encodeMetadataHeader", "encodeBinHeader", "binHdrSuffix",
  # (phase 7 S2 core, 2026-11-23) the head's fields (`model_transport.go`, grpc-go's
  # `http2Client.createHeaderFields`)
  "createHeaderFields"]
imports = ["!*", "context", "google.golang.org/grpc/metadata", "google.golang.org/grpc/peer",
  # (phase 7 S1) the types of `serverOptions`' and `dialOptions`' fields, so that the structs are
  # translated
  "time", "io", "net", "google.golang.org/grpc/credentials", "google.golang.org/grpc/keepalive",
  "google.golang.org/grpc/stats", "google.golang.org/grpc/resolver",
  # (phase7-inits) the hook variables its `init`s set
  "google.golang.org/grpc/internal",
  # (phase7-inits, batch 2) `logger`'s `grpclog.Component`
  "google.golang.org/grpc/grpclog",
  # (phase7-s2a, 2026-11-25; first phase 7 S2, 2026-11-22) the types of `Server`'s fields (`mu`,
  # `cv`, `serveWG`, `quit`), so that it is a translated struct
  "sync", "google.golang.org/grpc/internal/grpcsync",
  # (phase 7 S2 core, 2026-11-23; W1, 2026-11-26) the frame writers' `binary.BigEndian.AppendUint32`
  "encoding/binary",
  # (phase 7 S2 core; W1) the translated initializers' `status.Error` and codes
  "google.golang.org/grpc/codes", "google.golang.org/grpc/status",
  # (phase 7 S2 core; W1) what `createHeaderFields` and its helpers call: `strings`, `strconv`,
  # `encoding/base64` (`RawStdEncoding`), grpc's `internal/grpcutil` and `internal/metadata`
  "strings", "strconv", "encoding/base64", "google.golang.org/grpc/internal/grpcutil",
  "google.golang.org/grpc/internal/metadata"]

# translate the definitions of all type declarations goose supports
translate_types = true

