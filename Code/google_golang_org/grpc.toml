# Types and names only: the types of `clientv3.Client`'s fields `conn` (`*ClientConn`) and
# `callOpts` (`[]CallOption`), and of `clientv3.Config.DialOptions`; and (unit C1, the client
# meets the server) the interface `ClientConnInterface`, the type of the generated KV stub's
# `cc` field (`etcdserverpb.kVClient`), whose `Invoke` names `context.Context`: hence the import
# of `context`, without which the interface is axiomatized. (const-inits, 2026-11-19) `EnableTracing`
# (`var EnableTracing bool`, no initializer) translated: its allocation, the package fact's cell.
# (prove-smallinits, 2026-11-20) the call options `clientv3.defaultCallOpts` holds: `WaitForReady`,
# `MaxCallSendMsgSize`, `MaxCallRecvMsgSize` (struct literals of one scalar field).
# (prove-grpcsmall, 2026-11-20) `StaticMethod` and `Peer` (`rpc_util.go`), with their bodies (struct
# literals of the call options): `Peer`'s option holds a `*peer.Peer`, hence the import of `peer`.
# (prove-grpcext, 2026-11-20) the generic stream wrappers' methods etcd calls, with their bodies
# (`GenericClientStream.{Send,Recv}`, `GenericServerStream.{Send,Recv}`) and promoted ones
# (`GenericClientStream.{CloseSend,Context}`, `GenericServerStream.Context`): their specs' axioms are theorems.
translate = ["!*", "EnableTracing", "WaitForReady", "MaxCallSendMsgSize", "MaxCallRecvMsgSize",
  "StaticMethod", "Peer",
  "GenericClientStream.Send", "GenericClientStream.Recv", "GenericServerStream.Send",
  "GenericServerStream.Recv", "GenericClientStream.CloseSend", "GenericClientStream.Context",
  "GenericServerStream.Context",
  # (grpcdriver, 2026-11-24) the client-streaming wrappers gRPC's robustness driver calls, with their
  # bodies (`GenericClientStream.CloseAndRecv`: `CloseSend`, then `RecvMsg` into a new reply;
  # `GenericServerStream.SendAndClose`: `SendMsg`)
  "GenericClientStream.CloseAndRecv", "GenericServerStream.SendAndClose",
  # (phase 7 S1, 2026-11-21, notes/phase7-plan.md; grpc is the model's since S0) the server
  # option constructors that only store a closure, with their bodies, and the closures' holder (the
  # dial options' come with `dialOptions`, whose fields need more of grpc's packages)
  "newFuncServerOption", "funcServerOption.apply", "KeepaliveEnforcementPolicy", "MaxRecvMsgSize",
  "MaxSendMsgSize", "MaxConcurrentStreams", "ChainUnaryInterceptor", "ChainStreamInterceptor",
  # (phase 7 S1, dial side, 2026-11-22) the dial options etcd's client sets, and their holder
  "newFuncDialOption", "funcDialOption.apply", "WithTransportCredentials", "WithPerRPCCredentials",
  "WithUnaryInterceptor", "WithStreamInterceptor", "WithResolvers"]
imports = ["!*", "context", "google.golang.org/grpc/metadata", "google.golang.org/grpc/peer",
  # (phase 7 S1) the types of `serverOptions`' and `dialOptions`' fields, so that the structs are
  # translated
  "time", "io", "net", "google.golang.org/grpc/credentials", "google.golang.org/grpc/keepalive",
  "google.golang.org/grpc/stats", "google.golang.org/grpc/resolver"]

# translate the definitions of all type declarations goose supports
translate_types = true

trusted = ["Server.Serve"]

