# Types and names only: function and method bodies are axiomatized.
# Message, an alias of protoreflect.ProtoMessage (the type of apply.Result's Resp); MarshalOptions, a
# struct of options (rafthttp's msgappv2 encoder makes a zero one).
translate = ["!*", "Message", "MarshalOptions"]
imports = ["!*", "google.golang.org/protobuf/reflect/protoreflect", "google.golang.org/protobuf/internal/pragma"]
# The variables' initializers and `init` have trusted no-op models
# (TrustedCode/google_golang_org/protobuf/proto.lean): their readers are not translated.
trusted = ["wireTypes", "errUnknown", "errDecode", "errRecursionDepth", "init.0"]

# translate the definitions of all type declarations goose supports
translate_types = true
