# Types and names only (unit N4, 2026-10-17: `url.URL`, the element type of `types.URLs`, a field
# type of the server's configuration).
# With their bodies (phase 7 S5, 2026-11-24): what the net/http model's `ServeMux` runs on a request's
# path (`findHandler`'s `EscapedPath`, the routing tree's `PathUnescape`): `URL.EscapedPath`,
# `validEncoded`, `escape`, `unescape`, `PathUnescape`, `shouldEscape`, `ishex`, `unhex` and the
# character-class table `table` they read (an array literal of constants, translated: `urlTable`, a
# premise until net/url's initialization is proved).
translate = ["!*", "table", "upperhex", "encode*", "hexChar", "ishex", "unhex", "shouldEscape",
             "unescape", "PathUnescape", "escape", "URL.EscapedPath", "validEncoded"]
imports = ["!*", "strings"]

# translate the definitions of all type declarations goose supports
translate_types = true

# --- skipped package variables (mit-pdos/etcd-grove#23) ---
# Not translated: no Lean name, no initializer, no allocation (goose `[[skip]]`; until 2026-11-22
# their initializers were untranslated, `opaqueInitsOk`). goose refuses a reference to one from
# translated code, so no verified code reads them; each reason says why not running the
# initializer is unobservable.
[[skip]]
names = ["urlstrictcolons", "urlmaxqueryparams"]
reason = """
Their initializers call, besides literals of constants and other variables' values:
`internal/godebug.New` of a constant name allocates a `*Setting` holding the name (the environment
is read on the first `Value`, not here). So each terminates, cannot panic and has no effect beyond
its variable."""
# --- end of skipped package variables ---
