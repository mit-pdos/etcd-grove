# Types and names only: function and method bodies are axiomatized. (2026-10-23, rafthttp stage 4)
# The method and status constants translated: the pipeline's protocol reads their values.
# `StatusText` with its body (2026-11-20, prove-http: `http.StatusText_ok` proved).
# `Header.Set`/`Get` with their bodies, over net/textproto's (2026-11-21, prove-http3: the axioms
# `http.HeaderSet_ok`, `HeaderSetPtr_ok`, `HeaderGetPtr_ok`, `HeaderGetOwnPtr_ok` proved).
translate = ["!*", "Method*", "Status*", "Header.Set", "Header.Get"]
imports = ["!*", "net/textproto"]

# translate the definitions of all type declarations goose supports
translate_types = true

# --- skipped package variables (mit-pdos/etcd-grove#23) ---
