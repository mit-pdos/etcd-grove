# Names only (project k8s-apiserver; k8s 7g): `cmp.Diff`, which the driver's copy of Kubernetes'
# checker calls (`WatchValidator.compareEvents`, the replay's error messages); its spec at the
# checker's types is a trust-boundary axiom (notes/k8s-7g-scope.md §1.2). The types of `Diff`'s
# signature translated (the interfaces `Option` and the `applicableOption` its method returns), so
# that a call's variadic `[]Option` has a translated type; the rest axiomatized.
translate = ["!*", "Option", "applicableOption"]
imports = ["!*"]

# --- skipped package variables (mit-pdos/etcd-grove#23) ---
# Not translated: no Lean name, no initializer, no allocation (goose `[[skip]]`; until 2026-11-22
# their initializers were untranslated, `opaqueInitsOk`). goose refuses a reference to one from
# translated code, so no verified code reads them; each reason says why not running the
# initializer is unobservable.
[[skip]]
names = ["identsRx"]
reason = """
Its initializer calls, besides literals of constants and other variables' values:
`regexp.MustCompile` of a constant pattern compiles it (it panics only on an invalid pattern, and
these compile: Go runs the initializer at every start of every program importing the package);
compilation terminates. So it terminates, cannot panic and has no effect beyond its variable."""

[[skip]]
names = ["anyType", "stringType", "bytesType", "byteType"]
reason = """
Their initializers call, besides literals of constants and other variables' values:
`reflect.TypeOf`/`TypeFor` (and `Elem`) read the static type descriptor of a type. So each
terminates, cannot panic and has no effect beyond its variable."""

[[skip]]
names = ["randBool"]
reason = """
Its initializer calls, besides literals of constants and other variables' values:
`rand.New(rand.NewSource(time.Now().Unix())).Intn(2)` reads the clock and draws from a new private
source. So it terminates, cannot panic and has no effect beyond its variable."""

[[skip]]
names = ["textNil", "textEllipsis"]
reason = """
Their initializers call, besides literals of constants and other variables' values: `textLine` is a
conversion of a constant. So each terminates, cannot panic and has no effect beyond its variable."""

