# Types and names only (item 4, the server start): grpc-prometheus's server metrics, whose
# interceptors `v3rpc.Server` installs (`ServerMetrics.UnaryServerInterceptor`,
# `StreamServerInterceptor`), made by `NewServerMetrics` with options (`ServerMetricsOption`, a
# function type: `getServerMetrics` appends one).
translate = ["!*"]
imports = ["!*", "google.golang.org/grpc"]

# translate the definitions of all type declarations goose supports
translate_types = true
