# Types and names only: the auto-compactor's clock (`Clock`, `NewRealClock`; the spec-first pilot,
# notes/compactor-pilot-plan.md).
# (2026-11-20, prove-b64clock) but `keyClock = contextKey("clock")`, translated (`etc/gen-init.py`).
# `ErrFakeClockDeadlineExceeded = fmt.Errorf("clockwork.FakeClock: %w", context.DeadlineExceeded)`
# stays untranslated (`opaqueInitsOk`): Perennial's `Errorf` model is `errors.New(format)`, faithful
# only for formats without verbs, so no init proof may step through a `%w` call.
# (2026-11-21, prove-clock) the real clock: `NewRealClock` and `realClock`'s `After` and `Now`
# (`time.After`, `time.Now`), proved over Perennial's model of the runtime clock
# (`Proof/github_com/jonboulle/clockwork/`); its other methods stay names only.
translate = ["!*", "keyClock", "NewRealClock", "realClock", "realClock.After", "realClock.Now"]
# `time`: the interfaces' methods name `time.Time` and `time.Duration` (without it, Goose axiomatizes
# `Clock` as an opaque type, whose values are no interface values).
imports = ["!*", "time"]

# translate the definitions of all type declarations goose supports
translate_types = true

# --- skipped package variables (mit-pdos/etcd-grove#23) ---
# Not translated: no Lean name, no initializer, no allocation (goose `[[skip]]`; until 2026-11-22
# their initializers were untranslated, `opaqueInitsOk`). goose refuses a reference to one from
# translated code, so no verified code reads them; each reason says why not running the
# initializer is unobservable.
[[skip]]
names = ["ErrFakeClockDeadlineExceeded"]
reason = """
Its initializer calls, besides literals of constants and other variables' values: `fmt.Errorf` of a
constant format and constant arguments allocates the formatted error (fmt recovers a panic of a
formatting method; the arguments have none). So it terminates, cannot panic and has no effect beyond
its variable."""
# --- end of skipped package variables ---
