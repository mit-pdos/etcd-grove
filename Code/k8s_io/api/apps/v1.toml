# Types and names only: function and method bodies (the generated `DeepCopy`, protobuf and
# registration code) are axiomatized (project k8s-apiserver; notes/k8s-clientgo-goose.md). It
# imports what its types name, so that the API types (`DaemonSet`, `ControllerRevision`, ...) are
# concrete structs the listers read fields of (gap G4 of notes/k8s-etcd3-goose.md).
# The promoted `metav1.Object` accessors of the resources the model API server serves (their
# unfolds into `ObjectMeta`'s, translated with bodies; examples/k8sdaemonset/apimodel,
# notes/k8s-apimodel-goose.md); the types' own methods stay names only.
translate = ["!*", "DaemonSet.Get*", "DaemonSet.Set*", "ControllerRevision.Get*",
  "ControllerRevision.Set*",
  # the constants the model reads (a names-only constant is a value of unknown shape)
  "RollingUpdateDaemonSetStrategyType", "DeprecatedTemplateGeneration",
  # the constants the DaemonSet controller reads (phase 5 of notes/k8s-daemonset-plan.md)
  "ControllerRevisionHashLabelKey", "DefaultDaemonSetUniqueLabelKey",
  "OnDeleteDaemonSetStrategyType"]
imports = ["!*", "k8s.io/api/core/v1", "k8s.io/apimachinery/pkg/apis/meta/v1",
  "k8s.io/apimachinery/pkg/runtime", "k8s.io/apimachinery/pkg/util/intstr"]

# translate the definitions of all type declarations goose supports
translate_types = true
