# Types and names, with the bodies of the methods the proofs call (`RealClock`'s `Now`, `NewTimer`,
# `NewTicker`, `After`; `realTimer`'s and `realTicker`'s `C` and `Stop`), verified over Perennial's `time`
# (2026-11-18; they were trust-boundary axioms, project k8s-apiserver; notes/k8s-etcd3-goose.md).
# It imports `time` (Perennial's), so that its interfaces, whose methods name `time`'s types, translate (`translate_types` skips a type naming a package not imported):
# the watch cache calls its configuration's `Clock` (notes/kep-6404-plan.md).
translate = ["!*", "RealClock.Now", "RealClock.NewTimer", "RealClock.After", "RealClock.NewTicker", "realTimer.C", "realTimer.Stop",
  "realTicker.C", "realTicker.Stop",
  # (prove-smallinits, 2026-11-20) the `var _` conversions (until then `opaqueInitsOk`)
  "_"]
imports = ["time"]

# translate the definitions of all type declarations goose supports
translate_types = true
