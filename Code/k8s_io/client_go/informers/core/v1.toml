# With bodies (project k8s-apiserver; notes/k8s-daemonset-goose.md, "The informers"): the
# typed informers of the core/v1 resources (the example uses Pods and Nodes).
# Names only: each resource's `NewTyped<R>InformerWithOptions`, whose list-watch closures call
# `client.CoreV1().<R>s(ns).List/Watch` through client-go's typed `kubernetes/typed/core/v1`, a
# package the file does not import, which the pinned Goose names through the imported
# `k8s.io/api/core/v1` (gap D2).
translate = ["*",
  "!NewTypedConfigMapInformerWithOptions", "!NewTypedLimitRangeInformerWithOptions",
  "!NewTypedResourceQuotaInformerWithOptions", "!NewTypedComponentStatusInformerWithOptions",
  "!NewTypedEndpointsInformerWithOptions", "!NewTypedEventInformerWithOptions",
  "!NewTypedReplicationControllerInformerWithOptions", "!NewTypedPersistentVolumeInformerWithOptions",
  "!NewTypedServiceInformerWithOptions", "!NewTypedNamespaceInformerWithOptions",
  "!NewTypedPodTemplateInformerWithOptions", "!NewTypedServiceAccountInformerWithOptions",
  "!NewTypedSecretInformerWithOptions", "!NewTypedPodInformerWithOptions",
  "!NewTypedNodeInformerWithOptions", "!NewTypedPersistentVolumeClaimInformerWithOptions"]
imports = ["*"]

translate_types = true
