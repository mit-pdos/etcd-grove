# The local half with bodies (project k8s-apiserver; notes/k8s-clientgo-goose.md): the store
# (`store.go`), the thread-safe map and its indices (`thread_safe_store.go`, `index.go`), object
# names and keys, the listers' helpers (`listers.go`), the store's metrics (no-ops by default), and
# the cache-sync wait; the reflector, the FIFOs and the shared informer names only. The watch
# cache's store ranges over `Indexers` (`indexer.updateElem`; notes/kep-6404-plan.md).
translate = ["!*",
  # store.go
  "Store", "TransactionType", "TransactionTypeAdd", "TransactionTypeUpdate",
  "TransactionTypeDelete", "Transaction", "TransactionStore", "TransactionError",
  "TransactionError.Error", "KeyFunc", "KeyError", "KeyError.*", "ExplicitKey",
  "MetaNamespaceKeyFunc", "ObjectToName", "MetaObjectToName", "SplitMetaNamespaceKey", "cache",
  "cache.*", "StoreOption", "WithTransformer", "WithStoreMetrics", "NewStore", "NewIndexer",
  # thread_safe_store.go
  "ThreadSafeStore", "ThreadSafeStoreWithTransaction", "ThreadSafeStoreTransaction",
  "ThreadSafeStoreOption", "WithThreadSafeStoreMetrics", "storeIndex", "storeIndex.*",
  "threadSafeMap", "threadSafeMap.*", "rvFromObject", "NewThreadSafeStore",
  "parseRVForMetricsWithTruncation",
  # names only: its `min` on `time.Duration` (the slow-trace threshold) is rejected by the pinned
  # Goose (gap C4)
  "!threadSafeMap.Transaction",
  # index.go
  "Indexer", "IndexFunc", "IndexFuncToKeyFuncAdapter", "NamespaceIndex", "MetaNamespaceIndexFunc",
  "index", "Indexers", "Indices", "TypedIndexers", "TypedIndexFunc", "TypedIndexer",
  "TypedIndexersToIndexers", "TypedIndexerFuncToIndexerFunc",
  # object-names.go
  "ObjectName", "NewObjectName", "ObjectName.*", "ParseObjectName", "NamespacedNameAsObjectName",
  # listers.go (the listers' `ListAllByNamespace`)
  "AppendFunc", "ListAll", "ListAllByNamespace", "GenericLister", "GenericNamespaceLister",
  "NewGenericLister", "genericLister", "genericLister.*", "genericNamespaceLister",
  "genericNamespaceLister.*",
  # the store's metrics (informer_metrics.go, reflector_metrics.go, identity.go)
  "globalInformerMetricsProvider", "setInformerMetricsProviderOnce", "noopInformerMetricsProvider",
  "noopInformerMetricsProvider.*", "InformerMetricsProvider", "fifoMetrics", "storeMetrics",
  "SetInformerMetricsProvider", "newFIFOMetrics", "newStoreMetrics", "GaugeMetric",
  "CounterMetric", "SummaryMetric", "HistogramMetric", "noopMetric", "noopMetric.*",
  "InformerNameAndResource", "InformerNameAndResource.*",
  # DeletedFinalStateUnknown (delta_fifo.go), the deletion key functions (controller.go)
  "DeletedFinalStateUnknown", "TransformFunc", "DeletionHandlingMetaNamespaceKeyFunc",
  "DeletionHandlingObjectToName",
  # the cache-sync wait (shared_informer.go)
  "InformerSynced", "WaitForNamedCacheSyncWithContext", "WaitForCacheSync", "syncedPollPeriod"]
imports = ["!*", "context", "errors", "fmt", "strconv", "strings", "sync", "sync/atomic", "time",
  "k8s.io/apimachinery/pkg/api/errors", "k8s.io/apimachinery/pkg/api/meta",
  "k8s.io/apimachinery/pkg/apis/meta/v1", "k8s.io/apimachinery/pkg/labels",
  "k8s.io/apimachinery/pkg/runtime", "k8s.io/apimachinery/pkg/runtime/schema",
  "k8s.io/apimachinery/pkg/types", "k8s.io/apimachinery/pkg/util/runtime",
  "k8s.io/apimachinery/pkg/util/sets", "k8s.io/apimachinery/pkg/util/wait",
  "k8s.io/client-go/features", "k8s.io/klog/v2", "k8s.io/utils/trace"]
