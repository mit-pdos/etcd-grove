# Types and names only: function and method bodies are axiomatized (project k8s-apiserver;
# notes/k8s-daemonset-goose.md: what the DaemonSet controller and its example name).
translate = ["!*"]
# (phase 5 of notes/k8s-daemonset-plan.md) it imports what its interfaces name (`EventRecorder`,
# `EventBroadcaster`: `runtime.Object`, `v1.EventSource`, ...), so that they translate: an
# axiomatized interface type has no values a proof can use.
imports = ["!*", "context", "k8s.io/api/core/v1", "k8s.io/apimachinery/pkg/apis/meta/v1",
  "k8s.io/apimachinery/pkg/runtime", "k8s.io/apimachinery/pkg/watch", "k8s.io/klog/v2"]

# translate the definitions of all type declarations goose supports
translate_types = true
