# Types and names only: function and method bodies are axiomatized (project k8s-apiserver;
# notes/k8s-etcd3-goose.md). It imports `context`, the etcd client and `storage` (names only) so
# that the interfaces `etcd3.New` calls through, `FeatureSupportChecker` (`CheckClient(ctx,
# client, storage.Feature)`) and `client` (`Status(ctx, endpoint)`), are translated as interfaces
# (translate_types skips a type naming a package that is not imported; G4).
translate = ["!*"]
imports = ["!*", "context", "go.etcd.io/etcd/client/v3", "k8s.io/apiserver/pkg/storage"]

# translate the definitions of all type declarations goose supports
translate_types = true

# --- skipped package variables (mit-pdos/etcd-grove#23) ---
# Not translated: no Lean name, no initializer, no allocation (goose `[[skip]]`; until 2026-11-22
# their initializers were untranslated, `opaqueInitsOk`). goose refuses a reference to one from
# translated code, so no verified code reads them; each reason says why not running the
# initializer is unobservable.
[[skip]]
names = ["v3_4_31", "v3_5_0", "v3_5_13"]
reason = """
Their initializers call, besides literals of constants and other variables' values:
`version.MustParse*`/`MajorMinor` of constants allocate a version (`MustParse*` panics only on an
invalid constant, and these parse: Go runs the initializer at every start). So each terminates,
cannot panic and has no effect beyond its variable."""
# --- end of skipped package variables ---
