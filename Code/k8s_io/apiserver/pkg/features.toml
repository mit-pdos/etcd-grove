# Types and names only: function and method bodies are axiomatized (project k8s-apiserver;
# notes/k8s-etcd3-goose.md).
# (sweep repairs 1, B5, 2026-11-08) the five features etcd3 asks the default gate about are
# translated (string literals: `featureGateOk`'s specs quantify over them), and `util/feature` is
# imported, so this package's initializer initializes it first and `init.«0»`'s registration
# (`init_0_ok`) finds `DefaultMutableFeatureGate` set.
translate = ["!*", "ListFromCacheSnapshot", "AllowUnsafeMalformedObjectDeletion", "EtcdRangeStream",
             "WatchList", "ConcurrentWatchObjectDecode"]
imports = ["!*", "k8s.io/apiserver/pkg/util/feature"]

# translate the definitions of all type declarations goose supports
translate_types = true

# --- skipped package variables (mit-pdos/etcd-grove#23) ---
# Not translated: no Lean name, no initializer, no allocation (goose `[[skip]]`; until 2026-11-22
# their initializers were untranslated, `opaqueInitsOk`). goose refuses a reference to one from
# translated code, so no verified code reads them; each reason says why not running the
# initializer is unobservable.
[[skip]]
names = ["defaultVersionedKubernetesFeatureGates"]
reason = """
Its initializer calls, besides literals of constants and other variables' values:
`version.MustParse*`/`MajorMinor` of constants allocate a version (`MustParse*` panics only on an
invalid constant, and these parse: Go runs the initializer at every start). So it terminates, cannot
panic and has no effect beyond its variable."""
# --- end of skipped package variables ---
