# Types and names only: function and method bodies are axiomatized (project k8s-apiserver;
# notes/k8s-etcd3-goose.md), except `Set`'s lookups, which the k8s etcd3 driver's selectors call
# (stage 7e-2, Q7e-2-4: a map index and a comma-ok lookup, proved rather than trusted).
# (2026-11-19) with bodies: `Everything` (`andTerm{}`) and `andTerm.Empty`, which the storage
# package's initializer calls (`Proof/k8s_io/apimachinery/pkg/fields/Everything.lean`).
translate = ["!*", "Set.Get", "Everything", "andTerm.Empty"]
imports = ["!*"]

# translate the definitions of all type declarations goose supports
translate_types = true
