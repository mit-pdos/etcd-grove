# Types and names only, but for `Accessor` (a type switch on the metav1 interfaces; what
# `storage.Preconditions.Check` calls on the etcd3 store's objects, notes/k8s-etcd3-plan.md stage
# 7b): function and method bodies are axiomatized (project k8s-apiserver;
# notes/k8s-etcd3-goose.md).
# (k8s 7g, decided by etcd-grove-03 2026-11-19: proof over axiom) `ListAccessor`, with its body (a
# type switch on the list interfaces), which the reflector's pager and the driver's checker call.
translate = ["!*", "Accessor", "ListAccessor"]
imports = ["!*", "k8s.io/apimachinery/pkg/apis/meta/v1"]

# translate the definitions of all type declarations goose supports
translate_types = true

# --- skipped package variables (mit-pdos/etcd-grove#23) ---
# Not translated: no Lean name, no initializer, no allocation (goose `[[skip]]`; until 2026-11-22
# their initializers were untranslated, `opaqueInitsOk`). goose refuses a reference to one from
# translated code, so no verified code reads them; each reason says why not running the
# initializer is unobservable.
[[skip]]
names = ["isListCache", "RESTScopeNamespace", "RESTScopeRoot", "unpluralizedSuffixes"]
reason = """
Literals: composite literals, conversions and allocations (`make`, `new`, `&T{}`) of constants,
function values (built, not called) and other package variables' values or addresses, with no call.
Each terminates, cannot panic (its sizes, indices and keys are constants the compiler checks) and
has no effect beyond its variable."""

[[skip]]
names = ["errExpectFieldItems", "errExpectSliceItems"]
reason = """
Their initializers call, besides literals of constants and other variables' values: `errors.New` of
a constant allocates an `*errorString`. So each terminates, cannot panic and has no effect beyond
its variable."""

[[skip]]
names = ["objectSliceType", "objectType", "rawExtensionObjectType"]
reason = """
Their initializers call, besides literals of constants and other variables' values:
`reflect.TypeOf`/`TypeFor` (and `Elem`) read the static type descriptor of a type. So each
terminates, cannot panic and has no effect beyond its variable."""

[[skip]]
names = ["errNotCommon"]
reason = """
Its initializer calls, besides literals of constants and other variables' values: `fmt.Errorf` of a
constant format and constant arguments allocates the formatted error (fmt recovers a panic of a
formatting method; the arguments have none). So it terminates, cannot panic and has no effect beyond
its variable."""

