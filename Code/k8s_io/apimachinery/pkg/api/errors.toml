# Types and names only, but for `NewTimeoutError` (the watch cache's timeout,
# `storage.NewTooLargeResourceVersionError`'s; KEP-6404, notes/kep-6404-plan.md): function and
# method bodies are axiomatized (project k8s-apiserver; notes/k8s-etcd3-goose.md).
# With bodies too (the model API server's errors, examples/k8s/daemonset/apimodel;
# notes/k8s-apimodel-goose.md): `NewBadRequest`, `NewResourceExpired`, `NewNotFound`,
# `NewAlreadyExists` (their messages `Sprintf`s of strings); `NewConflict` and `NewInternalError`
# format an error (`%v`), which Perennial's `Sprintf` model does not cover: names only, specified
# at the trust boundary.
# k8s 7f-5a-P: `StatusError.Status` (`return e.ErrStatus`), which the etcd3 watcher's
# `transformErrorToEvent` calls through `err.(APIStatus).Status()`; and `StatusError.Error`
# (`return e.ErrStatus.Message`), which its error paths call (`kErrOk`).
translate = ["!*", "NewTimeoutError", "NewBadRequest", "NewResourceExpired", "NewNotFound",
  "NewAlreadyExists", "StatusError.Status", "StatusError.Error",
  # (prove-k8s, 2026-11-20) `var _ error = &StatusError{}` and `knownReasons`, a map literal (until then
  # `opaqueInitsOk`)
  "_", "knownReasons",
  # (prove-k8s2, 2026-11-20) the `APIStatus` checks, until then trust-boundary axioms: their
  # `errors.As` calls are specified by `Spec/errors/AsNoMatch.lean`
  "IsTimeout", "IsTooManyRequests", "HasStatusCause", "StatusCause", "SuggestsClientDelay",
  "reasonAndCodeForError"]
# what `NewTimeoutError`'s body names: `fmt.Sprintf`, `http.StatusGatewayTimeout`, metav1's
# `Status` constants
imports = ["!*", "errors", "fmt", "net/http", "k8s.io/apimachinery/pkg/apis/meta/v1",
  "k8s.io/apimachinery/pkg/runtime/schema"]

# translate the definitions of all type declarations goose supports
translate_types = true
