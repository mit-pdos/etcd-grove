# Types and names only: function and method bodies are axiomatized (project k8s-apiserver;
# notes/k8s-etcd3-goose.md), except `Set`'s lookups, which the k8s etcd3 driver's selectors call
# (stage 7e-2, Q7e-2-4: a map index and a comma-ok lookup, proved rather than trusted).
translate = ["!*", "Set.Get", "Set.Has"]
imports = ["!*"]

# translate the definitions of all type declarations goose supports
translate_types = true
