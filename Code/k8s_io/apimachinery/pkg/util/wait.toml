# Types and names only: function and method bodies are axiomatized (project k8s-apiserver;
# notes/k8s-etcd3-goose.md), but `ExponentialBackoff`, the loop client-go's `retry.OnError` runs
# (notes/k8s-clientgo-goose.md). It imports `time`, `context` and `k8s.io/utils/clock`, so that
# `Backoff` (whose literals `retry`'s variables are) and the function types translate.
# And `sync` (2026-10-27): so that `Group` (a `sync.WaitGroup`), the shared processor's field, translates.
# And (2026-11-04, K4 of notes/k8s-compactor-plan.md) `ContextForChannel` and `channelContext`'s methods, the context
# Kubernetes' compactor loop runs under.
translate = ["!*", "ExponentialBackoff", "ContextForChannel", "channelContext.Done", "channelContext.Err",
  "channelContext.Deadline", "channelContext.Value",
  # (prove-k8s, 2026-11-20) the variables' initializers (until then `opaqueInitsOk`), and `ErrorInterrupted`,
  # which `ErrWaitTimeout`'s calls
  "ErrWaitTimeout", "errWaitTimeout", "RealTimer", "internalClock", "ForeverTestTimeout", "NeverStop",
  "jitterRand", "_", "ErrorInterrupted"]
# `errors` and `math/rand` (prove-k8s): `ErrWaitTimeout`'s `errors.New`, `jitterRand`'s `rand.Float64`
imports = ["!*", "time", "context", "k8s.io/utils/clock", "sync", "errors", "math/rand"]

# translate the definitions of all type declarations goose supports
translate_types = true
