# Types and names only: function and method bodies are axiomatized (project k8s-apiserver;
# notes/k8s-etcd3-goose.md).
# (2026-11-19) with their bodies, proved instead of axiomatized (Proof/.../validation/field/): `NewPath`,
# `ErrorList.ToAggregate`, and what `fmt.Sprintf("%v", err)` of its `*Error`s runs (`Error.Error`,
# `Error.ErrorBody`, `ErrorType.String`), with the error-type constants they compare with
translate = ["!*", "NewPath", "ErrorList.ToAggregate", "Error.Error", "Error.ErrorBody",
  "ErrorType.String", "ErrorTypeNotFound", "ErrorTypeRequired", "ErrorTypeDuplicate",
  "ErrorTypeInvalid", "ErrorTypeNotSupported", "ErrorTypeForbidden", "ErrorTypeTooLong",
  "ErrorTypeTooMany", "ErrorTypeTooFew", "ErrorTypeInternal", "ErrorTypeTypeInvalid",
  "ErrorTypeTooShort",
  # (2026-11-19) the variable `ErrorBody` compares bad values with (`OmitValueType{}`)
  "omitValue"]
imports = ["!*", "fmt", "encoding/json", "k8s.io/apimachinery/pkg/util/errors", "k8s.io/apimachinery/pkg/util/sets"]

# translate the definitions of all type declarations goose supports
translate_types = true
