# Types and names only: function and method bodies are axiomatized (project k8s-apiserver;
# notes/k8s-etcd3-goose.md). It imports `types`, `runtime`, `schema` and `time` (names only) so
# that the types the etcd3 store and the storage package's versioner read objects through
# (the `Object` interface `meta.Accessor` returns, `ObjectMeta`, `ListMeta`) are translated
# (translate_types skips a type naming a package that is not imported).
# The status constants `apierrors.NewTimeoutError` and `storage.NewTooLargeResourceVersionError`
# build their errors with (KEP-6404): a names-only constant is a value of unknown shape.
# With bodies (the model API server, examples/k8s/daemonset/apimodel; notes/k8s-apimodel-goose.md):
# `ObjectMeta`'s accessors (the `metav1.Object` methods the model and client-go's informers call
# through the API types' promoted methods), `Now` and `Time.Equal`.
translate = ["!*", "StatusFailure", "StatusReasonTimeout", "CauseTypeResourceVersionTooLarge",
  "ObjectMeta.Get*", "ObjectMeta.Set*", "Now", "Time.Equal", "StatusReason*",
  # (k8s 7g) the typed lists' version and continue token, which `meta.ListAccessor`'s callers read
  # through the lists' promoted `ListMeta` methods
  "ListMeta.GetResourceVersion", "ListMeta.GetContinue",
  # (DaemonSet plan phase 4) `ListAllByNamespace` compares the namespace with it
  "NamespaceAll",
  # (DaemonSet plan phase 5) the daemon pods' node affinity and `GetTargetNodeName` use it
  "ObjectNameField",
  # BEGIN etc/gen-k8s-deep.py: the deep copies the proofs need (generated; do not edit)
  "LabelSelector.DeepCopyInto",
  "LabelSelectorRequirement.DeepCopyInto",
  "ManagedFieldsEntry.DeepCopyInto",
  "ObjectMeta.DeepCopyInto",
  "OwnerReference.DeepCopyInto",
  "Time.DeepCopy",
  "Time.DeepCopyInto",
  # END etc/gen-k8s-deep.py
  ]
imports = ["!*", "k8s.io/apimachinery/pkg/types", "k8s.io/apimachinery/pkg/runtime",
  "k8s.io/apimachinery/pkg/runtime/schema", "time"]

# translate the definitions of all type declarations goose supports
translate_types = true

# --- skipped package variables (mit-pdos/etcd-grove#23) ---
# Not translated: no Lean name, no initializer, no allocation (goose `[[skip]]`; until 2026-11-22
# their initializers were untranslated, `opaqueInitsOk`). goose refuses a reference to one from
# translated code, so no verified code reads them; each reason says why not running the
# initializer is unobservable.
[[skip]]
names = ["ErrInvalidLengthGenerated", "ErrIntOverflowGenerated", "ErrUnexpectedEndOfGroupGenerated"]
reason = """
Their initializers call, besides literals of constants and other variables' values: `fmt.Errorf` of
a constant format and constant arguments allocates the formatted error (fmt recovers a panic of a
formatting method; the arguments have none). So each terminates, cannot panic and has no effect
beyond its variable."""

