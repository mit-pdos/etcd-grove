# Types and names only: function and method bodies are axiomatized (project k8s-apiserver;
# notes/k8s-etcd3-goose.md). It imports `types`, `runtime`, `schema` and `time` (names only) so
# that the types the etcd3 store and the storage package's versioner read objects through
# (the `Object` interface `meta.Accessor` returns, `ObjectMeta`, `ListMeta`) are translated
# (translate_types skips a type naming a package that is not imported).
# The status constants `apierrors.NewTimeoutError` and `storage.NewTooLargeResourceVersionError`
# build their errors with (KEP-6404): a names-only constant is a value of unknown shape.
# With bodies (the model API server, examples/k8sdaemonset/apimodel; notes/k8s-apimodel-goose.md):
# `ObjectMeta`'s accessors (the `metav1.Object` methods the model and client-go's informers call
# through the API types' promoted methods), `Now` and `Time.Equal`.
translate = ["!*", "StatusFailure", "StatusReasonTimeout", "CauseTypeResourceVersionTooLarge",
  "ObjectMeta.Get*", "ObjectMeta.Set*", "Now", "Time.Equal", "StatusReason*"]
imports = ["!*", "k8s.io/apimachinery/pkg/types", "k8s.io/apimachinery/pkg/runtime",
  "k8s.io/apimachinery/pkg/runtime/schema", "time"]

# translate the definitions of all type declarations goose supports
translate_types = true
