# Types and names only: function and method bodies are axiomatized (project k8s-apiserver;
# notes/k8s-etcd3-goose.md). It imports `schema` and `io` (names only) so that the interfaces the
# etcd3 store calls through, `Object` (`GetObjectKind() schema.ObjectKind`) and `Encoder`/`Decoder`
# (`Encode(Object, io.Writer)`, `Decode(..., *schema.GroupVersionKind, ...)`), are translated as
# interfaces (translate_types skips a type naming a package that is not imported).
#
# With bodies (notes/k8s-etcd3-plan.md, stage 6c): `Encode` (the store's `runtime.Encode(codec,
# obj)`, through a `bytes.Buffer`) and `SetZeroValue` (`conversion.EnforcePtr` and `reflect`), so
# that the driver's contract rests on the trust-boundary specs of `bytes.Buffer` and `reflect`
# rather than on axioms of these two. And (k8s 7f-5a-P) `Decode`, the etcd3 watcher's `decodeObj`
# (`d.Decode(data, nil, nil)`), so that the watch path's contract is the codec's `Decode` method.
translate = ["!*", "Encode", "SetZeroValue", "Decode",
  # (prove-metav1, 2026-11-27) the append metav1's translated `init.1` calls
  # (`localSchemeBuilder.Register(RegisterConversions)`)
  "SchemeBuilder.Register",
  # BEGIN etc/gen-k8s-deep.py: the deep copies the proofs need (generated; do not edit)
  "RawExtension.DeepCopyInto",
  # END etc/gen-k8s-deep.py
  ]
imports = ["!*", "k8s.io/apimachinery/pkg/runtime/schema", "io", "bytes", "reflect",
           "k8s.io/apimachinery/pkg/conversion"]

# translate the definitions of all type declarations goose supports
translate_types = true

# --- skipped package variables (mit-pdos/etcd-grove#23) ---
# Not translated: no Lean name, no initializer, no allocation (goose `[[skip]]`; until 2026-11-22
# their initializers were untranslated, `opaqueInitsOk`). goose refuses a reference to one from
# translated code, so no verified code reads them; each reason says why not running the
# initializer is unobservable.
[[skip]]
names = ["AllocatorPool", "InternalGroupVersioner", "DisabledGroupVersioner", "cborNull",
  "cborSelfDescribed", "DefaultFramer", "internalPackages"]
reason = """
Literals: composite literals, conversions and allocations (`make`, `new`, `&T{}`) of constants,
function values (built, not called) and other package variables' values or addresses, with no call.
Each terminates, cannot panic (its sizes, indices and keys are constants the compiler checks) and
has no effect beyond its variable."""

[[skip]]
names = ["mapStringInterfaceType", "stringType"]
reason = """
Their initializers call, besides literals of constants and other variables' values:
`reflect.TypeOf`/`TypeFor` (and `Elem`) read the static type descriptor of a type. So each
terminates, cannot panic and has no effect beyond its variable."""

[[skip]]
names = ["fieldCache"]
reason = """
Its initializer calls, besides literals of constants and other variables' values: `newFieldsCache`
allocates an empty cache. So it terminates, cannot panic and has no effect beyond its variable."""

[[skip]]
names = ["DefaultUnstructuredConverter"]
reason = """
Its initializer calls, besides literals of constants and other variables' values: `parseBool` parses
a string; `os.Getenv` reads the environment; `conversion.EqualitiesOrDie` of a fixed function
allocates an equality table (it panics only on an ill-typed function, and this one is well typed: Go
runs it at every start). So it terminates, cannot panic and has no effect beyond its variable."""

[[skip]]
names = ["ErrInvalidLengthGenerated", "ErrIntOverflowGenerated", "ErrUnexpectedEndOfGroupGenerated"]
reason = """
Their initializers call, besides literals of constants and other variables' values: `fmt.Errorf` of
a constant format and constant arguments allocates the formatted error (fmt recovers a panic of a
formatting method; the arguments have none). So each terminates, cannot panic and has no effect
beyond its variable."""

