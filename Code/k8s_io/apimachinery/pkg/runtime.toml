# Types and names only: function and method bodies are axiomatized (project k8s-apiserver;
# notes/k8s-etcd3-goose.md). It imports `schema` and `io` (names only) so that the interfaces the
# etcd3 store calls through, `Object` (`GetObjectKind() schema.ObjectKind`) and `Encoder`/`Decoder`
# (`Encode(Object, io.Writer)`, `Decode(..., *schema.GroupVersionKind, ...)`), are translated as
# interfaces (translate_types skips a type naming a package that is not imported).
#
# With bodies (notes/k8s-etcd3-plan.md, stage 6c): `Encode` (the store's `runtime.Encode(codec,
# obj)`, through a `bytes.Buffer`) and `SetZeroValue` (`conversion.EnforcePtr` and `reflect`), so
# that the driver's contract rests on the trust-boundary specs of `bytes.Buffer` and `reflect`
# rather than on axioms of these two.
translate = ["!*", "Encode", "SetZeroValue"]
imports = ["!*", "k8s.io/apimachinery/pkg/runtime/schema", "io", "bytes", "reflect",
           "k8s.io/apimachinery/pkg/conversion"]

# translate the definitions of all type declarations goose supports
translate_types = true
