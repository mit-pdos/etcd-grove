# Names only, types axiomatized: the metric types the watch cache's metrics are of (`CounterVec`,
# `HistogramVec`, ...; project k8s-apiserver, notes/kep-6404-plan.md). Not `translate_types`: they
# wrap prometheus' collectors, which are not translated. The interfaces `ObserverMetric` and
# `CounterMetric` are translated (2026-11-18: the field types of etcd3's `OperationLatencyTracker`).
translate = ["!*", "ObserverMetric", "CounterMetric"]
imports = ["!*"]

# --- skipped package variables (mit-pdos/etcd-grove#23) ---
# Not translated: no Lean name, no initializer, no allocation (goose `[[skip]]`; until 2026-11-22
# their initializers were untranslated, `opaqueInitsOk`). goose refuses a reference to one from
# translated code, so no verified code reads them; each reason says why not running the
# initializer is unobservable.
[[skip]]
names = ["DefBuckets", "noopCounterVec", "noopHistogramVec", "noopTimingHistogramVec",
  "noopGaugeVec", "noop", "disabledMetrics", "labelValueAllowLists", "defObjectives",
  "BuildVersion"]
reason = """
Literals: composite literals, conversions and allocations (`make`, `new`, `&T{}`) of constants,
function values (built, not called) and other package variables' values or addresses, with no call.
Each terminates, cannot panic (its sizes, indices and keys are constants the compiler checks) and
has no effect beyond its variable."""

[[skip]]
names = ["disabledMetricsTotal", "hiddenMetricsTotal",
  "cardinalityEnforcementUnexpectedCategorizationsTotal", "processStartTime",
  "registeredMetricsTotal", "buildInfo"]
reason = """
Their initializers call, besides literals of constants and other variables' values: component-base's
`NewCounter`/`NewCounterVec`/`NewGaugeVec`/`NewHistogram`/`NewHistogramVec`/`NewDesc` allocate a
lazy metric (or descriptor) holding the options, unregistered (`lazyInit` sets the new metric's own
fields; registration is a separate call, not made here). So each terminates, cannot panic and has no
effect beyond its variable."""

[[skip]]
names = ["versionRe"]
reason = """
Its initializer calls, besides literals of constants and other variables' values:
`regexp.MustCompile` of a constant pattern compiles it (it panics only on an invalid pattern, and
these compile: Go runs the initializer at every start of every program importing the package);
compilation terminates. So it terminates, cannot panic and has no effect beyond its variable."""

[[skip]]
names = ["errNotRegistered"]
reason = """
Its initializer calls, besides literals of constants and other variables' values: `errors.New` of a
constant allocates an `*errorString`. So it terminates, cannot panic and has no effect beyond its
variable."""

