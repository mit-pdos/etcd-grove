# Types and names only: function and method bodies are axiomatized (project k8s-apiserver;
# notes/k8s-etcd3-goose.md). It imports `logr` (names only), so that the alias `Logger = logr.Logger`
# translates (client-go's workqueue names it; notes/k8s-clientgo-goose.md, gap C3).
# (klog-leaves, 2026-11-23, etcd-grove#25) with bodies: `V` and what it runs (`VDepth`, `newVerbose`,
# `Level.get`), and the variable `logging` they read (allocated zero: no initializer; its fact,
# `klog.loggingOk`, Proof/k8s_io/klog/v2/Base.lean). For `loggingT` to translate (so that `logging`
# and its fields have a type), the packages its fields' types name are imported (`sync`, `io`,
# `time`, `sync/atomic` and `runtime` for `VDepth`'s calls, klog's `internal/severity`, names only).
# (klog-printf, 2026-11-23, etcd-grove#25) with bodies also the printf path: `Errorf`, `Warningf`,
# `Verbose.Infof`, `loggingT.printf` and `loggingT.printfDepth`, over Perennial's `fmt.Fprintf` and
# `bytes.Buffer`; klog's output side is trusted (`loggingT.header`, `loggingT.output`: models in
# TrustedCode/k8s_io/klog/v2.lean), and its buffer package translated types only
# (Code/k8s_io/klog/v2/internal/buffer.toml).
# (klog-infos, 2026-11-23, etcd-grove#25) with bodies also the structured path of `Verbose.InfoS`:
# `loggingT.infoS`, `loggingT.printS`, `loggingT.printDepth`, `loggingT.printWithInfos`, over
# Perennial's `strconv.AppendQuote` and `fmt.Fprint`, klog's buffer pool (`buffer.GetBuffer`,
# `PutBuffer`, translated: Code/k8s_io/klog/v2/internal/buffer.toml) and its key/value serializer
# (`serialize.FormatKVs`, trusted: Code/k8s_io/klog/v2/internal/serialize.toml).
translate = ["!*", "V", "VDepth", "newVerbose", "Level.get", "logging",
  "Errorf", "Warningf", "Verbose.Infof", "loggingT.printf", "loggingT.printfDepth",
  "Verbose.InfoS", "loggingT.infoS", "loggingT.printS", "loggingT.printDepth",
  "loggingT.printWithInfos"]
imports = ["!*", "github.com/go-logr/logr", "sync", "sync/atomic", "io", "time", "runtime",
  "k8s.io/klog/v2/internal/severity", "fmt", "k8s.io/klog/v2/internal/buffer", "strconv",
  "k8s.io/klog/v2/internal/serialize"]

# translate the definitions of all type declarations goose supports
translate_types = true

# --- skipped package variables (mit-pdos/etcd-grove#23) ---
# Not translated: no Lean name, no initializer, no allocation (goose `[[skip]]`; until 2026-11-22
# their initializers were untranslated, `opaqueInitsOk`). goose refuses a reference to one from
# translated code, so no verified code reads them; each reason says why not running the
# initializer is unobservable.
# (etcd-grove#32, 2026-11-22) the `init` functions trusted: a model that does nothing
# (TrustedCode/k8s_io/klog/v2.lean; until then names-only, the axiom `initFuncsOk`)
trusted = ["init.0", "init.1",
  # (klog-printf, 2026-11-23) the output side of the printf path: models in
  # TrustedCode/k8s_io/klog/v2.lean, each docstring says why it is faithful
  "loggingT.header", "loggingT.output"]

