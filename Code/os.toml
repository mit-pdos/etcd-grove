# Project bboltfs's `os` (etc/goose.py), not Perennial's (`Perennial.Code.os`, which trusts
# nothing; the two must never be in one import closure): every project translates with `os=`
# (2026-11-03: raft, etcd, bbolt, raft-witness, k8s-apiserver, k8s-daemonset, so that bbolt's
# `os.FileMode` fields translate; k8s-compactor since), and minibolt (examples/osfs/bboltfs) and
# bbolt call its models.
# The flags, and `File` (`struct{ *file }`) as it is; `FileInfo`, `FileMode` and `PathError` are
# aliases of io/fs's (Code/io/fs.toml).
translate = ["!*", "O_RDONLY", "O_WRONLY", "O_RDWR", "O_APPEND", "O_CREATE", "O_EXCL", "O_SYNC",
  "O_TRUNC", "File", "FileInfo", "FileMode", "PathError",
  # real Go over the trusted layouts of `file` and `fileStat` (`return f.name`, `return fs.size`)
  "File.Name", "fileStat.Size",
  # (2026-11-13, the WAL's decoder) `return fs.name`, over the trusted layout of `fileStat`
  "fileStat.Name",
  # (2026-11-07) the package-level variable initializers and `init` (what importing `os` runs), as
  # Perennial's os.toml (its fix-semantics Case 33): the `errors.New` errors, `checkWrapErr`,
  # `dirBufPool`'s `sync.Pool` literal, io/fs's error variables, `lstat = Lstat`, the `var _ fs.X =
  # dirFS("")` assertions, `checkPidfdOnce = sync.OnceValue(checkPidfd)`, `Interrupt`/`Kill`,
  # internal/poll's `ErrNoDeadline`/`ErrDeadlineExceeded` and `CopyFileRange`/`Splice` function
  # values, and `init.0` (`Args = runtime_args()` unless `runtime.GOOS` is "windows", a constant goose
  # emits as its value). `Stdin`, `Stdout`, `Stderr` and `runtime_args` are trusted (below).
  "ErrProcessDone", "errProcessReleased", "ErrNoHandle",
  "errWriteAtInAppendMode", "errPathEscapes", "errPatternHasSeparator",
  "checkWrapErr", "dirBufPool",
  "ErrInvalid", "ErrPermission", "ErrExist", "ErrNotExist", "ErrClosed",
  "_", "lstat", "checkPidfdOnce",
  "Interrupt", "Kill",
  "ErrNoDeadline", "ErrDeadlineExceeded", "errNoDeadline", "errDeadlineExceeded",
  "pollCopyFileRange", "pollSplice",
  "Args", "init.0",
  # real Go over OpenFile (`return OpenFile(name, O_RDONLY, 0)`); the error type of Rename
  "Open", "LinkError", "LinkError.Error",
  # (2026-11-13, the WAL over fsExt) real Go over the trusted layout of `fileStat`
  # (`return fs.mode`, `return fs.Mode().IsDir()`), and over the models of OpenFile, File.Write and
  # File.Close (`WriteFile`, fileutil's IsDirWriteable)
  "fileStat.Mode", "fileStat.IsDir", "WriteFile",
  # pure helpers the models of MkdirAll and RemoveAll call (path.go, path_unix.go)
  "IsPathSeparator", "endsWithDot", "splitPath",
  # (2026-11-13, os.MkdirAll's proof) the constant IsPathSeparator compares with
  "PathSeparator",
  # (2026-11-14, `io.Copy` of two files, the WAL's Repair: notes/wal-fsext-plan.md, "io.Copy log")
  # Go's zero-copy dispatch (file.go, zero_copy_linux.go, zero_copy_posix.go, rawconn.go,
  # file_posix.go) over the models; `File.readFrom`, `File.copyFileRange` and `File.spliceToFile`
  # touch `pfd`/`appendMode`, which the trusted `file` layout has not, and are trusted (below)
  "File.ReadFrom", "File.WriteTo", "genericReadFrom", "genericWriteTo",
  "noReadFrom.ReadFrom", "noWriteTo.WriteTo",
  "File.writeTo", "getPollFDAndNetwork", "isUnixOrTCP", "tryLimitedReader",
  "File.checkValid", "File.wrapErr", "File.SyscallConn", "newRawConn",
  "wrapSyscallError", "NewSyscallError", "SyscallError.Error", "SyscallError.Unwrap",
  # (2026-11-22, `io.CopyFiles.spec`'s proof) the promoted methods the dispatch calls on its wrapper
  # structs (method-set wrappers: `MethodUnfold`s that resolve through the embedded `*File`):
  # `genericReadFrom`'s loop reads `fileWithoutWriteTo` and writes `fileWithoutReadFrom`, and
  # `spliceToFile`'s `getPollFDAndNetwork` calls `fileWithoutWriteTo`'s `SyscallConn`
  "fileWithoutWriteTo.Read", "fileWithoutWriteTo.SyscallConn", "fileWithoutReadFrom.Write",
  # (2026-11-24, S5) Go's code over the model (the [model] table below)
  "fileStat", "File.Fd", "File.fd", "File.readFrom", "File.spliceToFile",
  "rawConn.Control", "rawConn.Read", "rawConn.Write",
  "MkdirAll", "Mkdir", "Remove", "fixLongPath", "ignoringEINTR", "syscallMode",
  "supportsCreateWithStickyBit",
  "ModeDir", "ModeSymlink", "ModeSetuid", "ModeSetgid", "ModeSticky"]
# what the models use: errors.New, io.EOF, fs.PathError and FileInfo, syscall.Errno
imports = ["!*", "errors", "io", "io/fs", "syscall", "sync", "internal/poll", "sync/atomic", "time",
  "runtime", "internal/filepathlite", "internal/gomodel"]
# (2026-11-24, Go-model overlays S5, perennial#692) The functions and methods minibolt, the WAL and
# fileutil call are Go: Go's own code where it translates (above and below), and elsewhere the Go
# model of the [model] table (models/os/model.go, each declaration's MODEL: comment says why it has at
# least Go's behaviours), over the primitive stubs here: one operation of the Linux file extension
# fsExt each (models/os/stubs.go; GooseLang/Ext/Fs/Impl.lean), with their GooseLang models in
# TrustedCode/os.lean. Until then `file`, `fileStat` and the functions were hand-written GooseLang
# (TrustedCode/os.lean), the layouts with hand-stated field facts (`os.file.FieldAssumptions`).
trusted = ["fsOpen", "fsPRead", "fsPWrite", "fsFdKind", "fsClose", "fsDirClose", "fsOutClose",
  "fsFstat", "fsFtruncate", "fsFsync", "fsDirSync", "fsOutSync", "fsLstatDir", "fsRename",
  "fsUnlink", "fsRmdir", "fsDirReadNext", "fsPathKind", "fsWithCall",
  # (2026-11-07) `runtime_args`, a linkname into the runtime with no Go body (goose: "unsupported:
  # external function"): an arbitrary `[]string` (TrustedCode/os.lean). A primitive, not a Go model:
  # a model body would replace the runtime's in gc builds, whose programs (and os's own tests) need
  # the real arguments.
  "runtime_args",
  # (2026-11-07) the initializer's standard streams, the user's decisions (Perennial fix-semantics
  # Case 33; TrustedCode/os.lean): `Stdin`/`Stdout` do nothing (variables not allocated); `Stderr`
  # allocates its variable and stores an arbitrary in-range address with no cell, not reserved
  # (`GoPrealloc`). Translated code (raft's default logger, dsverify's dlog) loads them, so they
  # cannot be skipped, and an address with no cell has no Go expression.
  "Stdin", "Stdout", "Stderr"]

# (2026-11-07) every type declaration goose supports, as Perennial's: the `var _ I = ...`
# assertions convert to interface types
translate_types = true

# (2026-11-24, S5) Go's code over the model: the real `fileStat` (its layout: `modTime` and `sys` are
# left zero by the models, so `ModTime`, `Sys` and `sameFile` stay untranslated), `File.Fd`, the
# zero-copy dispatch's `readFrom`/`spliceToFile` (`pollSplice` and `rawConn`'s `poll.FD.Raw*` are
# names only: no proof passes them), `MkdirAll` (over `internal/filepathlite`), and `Mkdir`/`Remove`
# over syscall's models of `Mkdir`, `Unlink` and `Rmdir` (Code/syscall.toml).
[model]
dir = "models/os"
replaces = ["file", "OpenFile", "File.Close", "File.ReadAt", "File.WriteAt", "File.Seek",
  "File.Write", "File.Read", "File.Stat", "File.Truncate", "File.Sync", "Rename",
  "File.Readdirnames", "Stat", "Lstat", "RemoveAll", "File.copyFileRange"]

[[skip]]
names = ["modelDirNames", "modelDirNamesMu"]
reason = """
The gc-only state of the stub fsDirReadNext (models/os/stubs.go): a map literal and its mutex, read
and written only by the Go bodies of that stub and fsDirClose, which is not translated (its GooseLang model is the extension's
DirReadNext)."""
