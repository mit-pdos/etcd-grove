# A standard-library package Perennial does not translate: the lessor's expiry notifier pushes
# and fixes its queue with `heap.Push` and `heap.Fix`, translated with the sift loops they call
# (`up`, `down`) and proved (`Proof/container/heap/`); the rest names only. `sort` for the
# interface `heap.Interface` embeds (`sort.Interface`).
translate = ["!*", "Fix", "Push", "up", "down"]
imports = ["!*", "sort"]

# translate the definitions of all type declarations goose supports
translate_types = true
