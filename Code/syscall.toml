# Project bboltfs's `syscall` (etc/goose.py; Perennial does not translate it): what minibolt
# (examples/osfs/bboltfs) uses. `Errno`, the type of the errors the models return, and the constants
# minibolt names.
translate = ["!*", "Errno", "LOCK_SH", "LOCK_EX", "LOCK_NB", "LOCK_UN", "PROT_READ", "MAP_SHARED",
  "MADV_RANDOM", "EWOULDBLOCK", "ENOSYS",
  # (2026-11-07) the package-level variable initializers (what importing syscall runs), as
  # Perennial's syscall.toml, and the constants they use
  "envs", "env", "copyenv",
  "none", "slash", "forceClone3", "fcntl64Syscall",
  "pageBufPool", "mapper",
  "Stdin", "Stdout", "Stderr",
  "errEAGAIN", "errEINVAL", "errENOENT",
  "errors", "signals", "_",
  "SYS_FCNTL", "EAGAIN", "EINVAL", "ENOENT"]
imports = ["!*", "sync"]
# The functions minibolt calls, modeled by the Linux file extension osFsExt
# (TrustedCode/syscall.lean, GooseLang/Ext/OsFs/Impl.lean).
trusted = ["Fdatasync", "Flock",
  # (2026-11-04) `Errno`'s `Error()`, so that an errno error is one `fmt` formats (`fmtErrorOk`,
  # Spec/fmt/ErrorOk.lean): some string. Translatable since 2026-11-07 (its body reads the `errors`
  # table, now a translated initializer, and calls `strconv.Itoa`); kept trusted until its spec takes
  # `isPkgInit syscall` (`notes/perennial-changes.md`, "Package initialization", still open)
  "Errno.Error",
  # (2026-11-07) the initializer's untranslated pieces, the user's decisions (Perennial fix-semantics
  # Case 33; TrustedCode/syscall.lean): `runtime_envs` (a linkname, no Go body) an arbitrary
  # `[]string`; `init.0` (the RLIMIT_NOFILE raise through raw `prlimit`) a no-op, `exec` being
  # outside what Perennial models
  "runtime_envs", "init.0"]

# (2026-11-07) every type declaration goose supports, as Perennial's: the initializers build
# `mmapper` and `sync.Pool` literals
translate_types = true
