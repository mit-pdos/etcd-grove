# Project bboltfs's `syscall` (etc/goose.py; Perennial does not translate it): what minibolt
# (examples/osfs/bboltfs) uses. `Errno`, the type of the errors the models return, and the constants
# minibolt names.
translate = ["!*", "Errno", "LOCK_SH", "LOCK_EX", "LOCK_NB", "LOCK_UN", "PROT_READ", "MAP_SHARED",
  "MADV_RANDOM", "EWOULDBLOCK", "ENOSYS",
  # (2026-11-07) the package-level variable initializers (what importing syscall runs), as
  # Perennial's syscall.toml, and the constants they use
  "envs", "env", "copyenv",
  "none", "slash", "forceClone3", "fcntl64Syscall",
  "pageBufPool", "mapper",
  "Stdin", "Stdout", "Stderr",
  "errEAGAIN", "errEINVAL", "errENOENT",
  "errors", "signals", "_",
  "SYS_FCNTL", "EAGAIN", "EINVAL", "ENOENT",
  # the WAL's lock type (examples/osfs/walfs)
  "F_WRLCK",
  # (prove-etcdint3, 2026-11-21) the backend's `boltOpenOptions` (`config_linux.go`)
  "MAP_POPULATE",
  # (2026-11-22, wal-safe-errors) `Errno.Is` with its body (what `errors.Is` calls on an errno) and the
  # constants it compares with
  "Errno.Is", "EACCES", "EPERM", "EEXIST", "ENOTEMPTY", "ENOTSUP", "EOPNOTSUPP",
  # (2026-11-24, Go-model overlays S6) what net's translated `OpError.Timeout`/`Temporary` and
  # `isConnError` call on an errno: `Errno.Timeout`/`Temporary` with Go's bodies, the constants
  # they compare with
  "Errno.Timeout", "Errno.Temporary", "EINTR", "EMFILE", "ENFILE", "ETIMEDOUT", "ECONNRESET",
  "ECONNABORTED"]
imports = ["!*", "sync", "errors", "internal/oserror", "internal/gomodel"]
# (2026-11-24, Go-model overlays S5, perennial#692) The functions minibolt, the WAL, fileutil and
# os's Go code call are the Go model of the [model] table below (models/syscall/model.go, each
# declaration's MODEL: comment says why it has at least Go's behaviours), over the primitive stubs
# here: one operation of the Linux file extension fsExt each (models/syscall/stubs.go;
# GooseLang/Ext/Fs/Impl.lean), their GooseLang models in TrustedCode/syscall.lean. Until then the
# functions were hand-written GooseLang (TrustedCode/syscall.lean).
trusted = ["fsFsync", "fsFlock", "fsFalloc", "fsFallocKeep", "fsOfdLock", "fsMkdir", "fsUnlink",
  "fsRmdir", "fsPathKind",
  # (2026-11-07) `runtime_envs`, a linkname into the runtime with no Go body: an arbitrary `[]string`
  # (TrustedCode/syscall.lean). A primitive, not a Go model: a model body would replace the
  # runtime's in gc builds, whose programs (and the packages' own tests) need the real environment.
  "runtime_envs"]

# (2026-11-07) every type declaration goose supports, as Perennial's: the initializers build
# `mmapper` and `sync.Pool` literals
translate_types = true

# (2026-11-24, S5) `errnoErr` (Go's reads the skipped preallocated errors), `Errno.Error` (an
# arbitrary string: Go's reads the `errors` table, and its spec, `fmtErrorOk`, has no package fact),
# the initializer's `init.0` (the RLIMIT_NOFILE raise: the user's decision in Perennial fix-semantics
# Case 33), the system-call stubs minibolt and
# fileutil call, and the *at wrappers os's Go `Mkdir`/`Remove` call.
[model]
dir = "models/syscall"
replaces = ["errnoErr", "Errno.Error", "init.0", "Fdatasync", "Flock", "Fallocate",
  "FcntlFlock", "Mkdir", "Unlink", "Rmdir"]
