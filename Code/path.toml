# The standard library's `path` (Perennial does not translate it), with the bodies rafthttp needs
# (D33, stage 2; the user chose a translation over a trusted model, 2026-10-22): `Join`, `Clean`
# (with its `lazybuf`), `Dir`, `Base`, `Split`. The rest (`Match`, `Ext`, `IsAbs`, `ErrBadPattern`)
