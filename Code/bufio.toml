# (project etcd's part `LinuxFs/`; Perennial does not translate bufio) types and names, and (WAL
# leaf specs, 2026-11-13) with their bodies what the WAL's decoder runs of a `*bufio.Reader`
# (`fileutil.NewFileBufReader`'s `NewReader`, and `Read`, through `io.ReadFull`/`binary.Read`):
# `NewReader`, `NewReaderSize`, `(*Reader).reset`, `Read`, `readErr`, `Buffered`, the constants
# they use, and the package's error variables (`errors.New` calls), proved in
# `Proof/bufio/`.
translate = ["!*", "Reader", "NewReader", "NewReaderSize", "Reader.reset", "Reader.Read",
  "Reader.readErr", "Reader.Buffered", "defaultBufSize", "minReadBufferSize",
  "errNegativeRead", "ErrInvalidUnreadByte", "ErrInvalidUnreadRune", "ErrBufferFull",
  "ErrNegativeCount", "errNegativeWrite", "ErrTooLong", "ErrNegativeAdvance", "ErrAdvanceTooFar",
  "ErrBadReadCount", "ErrFinalToken"]
imports = ["!*", "io", "errors"]

# translate the definitions of all type declarations goose supports
translate_types = true

# --- skipped package variables (mit-pdos/etcd-grove#23) ---
# Not translated: no Lean name, no initializer, no allocation (goose `[[skip]]`; until 2026-11-22
# their initializers were untranslated, `opaqueInitsOk`). goose refuses a reference to one from
# translated code, so no verified code reads them; each reason says why not running the
# initializer is unobservable.
[[skip]]
names = ["errorRune"]
reason = """
Literals: composite literals, conversions and allocations (`make`, `new`, `&T{}`) of constants,
function values (built, not called) and other package variables' values or addresses, with no call.
Each terminates, cannot panic (its sizes, indices and keys are constants the compiler checks) and
has no effect beyond its variable."""
# --- end of skipped package variables ---
