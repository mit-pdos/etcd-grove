# Names only, with the interface `Addr` (unit P3a): the type of grpc's `peer.Peer`'s fields (the
# client's retry interceptor allocates a `peer.Peer`); and the interface `Listener` (item 9, the
# adequacy example: `Main` keeps `net.Listen`'s listener in a local variable); and the interface
# `Conn` (notes/client-cut-plan.md K1: the bridge, third_party/bridge, keeps its connections in
# struct fields and converts them to io.Reader/io.Writer). Function and method bodies, and the other
# types, are axiomatized (not `translate_types`: some of net's types are cgo's).
# `time`: Conn's SetDeadline takes a time.Time.
translate = ["!*", "Addr", "Listener", "Conn"]
imports = ["!*", "time"]
