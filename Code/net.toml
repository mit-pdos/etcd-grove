# Names only, with the interface `Addr` (unit P3a): the type of grpc's `peer.Peer`'s fields (the
# client's retry interceptor allocates a `peer.Peer`); and the interface `Listener` (item 9, the
# adequacy example: `Main` keeps `net.Listen`'s listener in a local variable). Function and method
# bodies, and the other types, are axiomatized (not `translate_types`: some of net's types are
# cgo's).
translate = ["!*", "Addr", "Listener"]
imports = ["!*"]
