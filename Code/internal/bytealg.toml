# The standard library's `internal/bytealg` (Perennial does not translate it): `LastIndexByteString`
# with its body (the pure Go of `lastindexbyte_generic.go`), which `path`'s `Split` and `Base` call
# (D38, stage 2). The rest names only.
translate = ["!*", "LastIndexByteString"]
imports = ["!*"]

# translate the definitions of all type declarations goose supports
translate_types = true
# (etcd-grove#32, 2026-11-22) the `init` function trusted: a model that does nothing
# (TrustedCode/internal/bytealg.lean; until then names-only, the axiom `initFuncsOk`)
trusted = ["init.0"]
