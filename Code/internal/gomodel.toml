# (Go model overlays, perennial#692) Perennial's internal/gomodel, as Perennial's own config
# (Perennial/Code/internal/gomodel.toml at the Lean pin): the choice and stuck points of this
# repository's standard-library models. Its Go files are Perennial's at the pin, put in the [model]
# dir by etc/gomodels.py (etc/goose.py runs it), so nothing is copied into this repository; its Lean
# is Perennial's (`Perennial.Code.internal.gomodel`, with its TrustedCode stubs): this repository
# does not translate it.
# internal/gomodel: added to the standard library by its Go model overlay
# (a whole-package model of a path that does not exist): the choice and stuck
# points of the standard-library models. All three functions are primitive
# stubs, modelled in Perennial/TrustedCode/internal/gomodel.lean.
translate = ["!*"]
trusted = ["Choose", "ChooseUint64", "Stuck"]

[model]
dir = ".lake/gomodel/internal/gomodel"
replaces = ["*"]
