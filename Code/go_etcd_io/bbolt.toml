# Project bbolt (etc/goose.py): bbolt v1.5.0 as etcd links it, from the fork's `goose-lean`
# (upamanyus/bbolt), with bodies. Its `os`, `io/fs`, `syscall` and `golang.org/x/sys/unix` are
# this repository's (project bboltfs's: the file calls are modeled by the Linux file extension
# osFsExt); notes/bbolt-v2-infra.md.
#
# But `Options` stays an axiomatized type, and `DefaultOptions`' initializer (a literal of it)
# untranslated: the backend's constructor and every example's `newBackend` rest on the
# trust-boundary axioms over an abstract `Options` (`storage/backend/BboltOptions.lean`), which a
# translated struct would bypass. To translate it with `Open`'s proof, those axioms become
# lemmas.
translate = ["*", "!Options", "!DefaultOptions", "!splitThreshold"]
imports = ["*"]
# `splitThreshold` (`node.go`, the fork's `goose-lean-v2`: `splitTwo`'s float threshold factored
# out): Perennial gives float multiplication and float-to-int conversion no meaning, so its model,
# `TrustedCode/go_etcd_io/bbolt.lean`, states the bounds Go's computation has (D17).
trusted = ["splitThreshold"]
