# raftpb is protobuf-go v2 (raft.pb.go generated by protoc-gen-go): the messages are
# structs whose optional fields are pointers, read through getters. Everything is
# translated but the protobuf runtime plumbing (ProtoReflect, Descriptor, Reset, String,
# the enums' descriptors, and the file descriptor's initialization), which is names only.
translate = ["*",
  "!*.ProtoReflect", "!*.Descriptor", "!*.Reset", "!*.String", "!*.EnumDescriptor",
  "!*.Type", "!*.Number", "!file_raft_proto*", "!init"]

# confstate.go calls into fmt, slices and proto (Clone, Equal); confchange.go into fmt,
# strconv, strings and proto (Marshal); raft.pb.go into the protobuf runtime
imports = ["fmt", "slices", "strconv", "strings", "google.golang.org/protobuf/proto",
  "google.golang.org/protobuf/runtime/protoimpl",
  "google.golang.org/protobuf/reflect/protoreflect"]

trust_proofgen = true

# translate the definitions of all type declarations goose supports
translate_types = true
