# raftpb is protobuf-go v2 (raft.pb.go generated by protoc-gen-go): the messages are
# structs whose optional fields are pointers, read through getters, and whose enums have
# `Enum()` (a pointer to the value). Everything is translated (raft.pb.go's getters and
# `Enum()`s, the hand-written confchange.go, confstate.go, util.go's `Ensure*`, alias.go's
# names) but the protobuf runtime plumbing, which is names only: `ProtoReflect`,
# `Descriptor`, `Reset`, `String`, the enums' `Type`/`Number`/`EnumDescriptor`/
# `UnmarshalJSON`, the file descriptor and its initialization (`file_raft_proto*`, `init.0`).
# (After the configuration of branch raft-upstream-1c0011d2-wip, 2026-10-09.)
translate = ["*",
  "!*.ProtoReflect", "!*.Descriptor", "!*.Reset", "!*.String", "!*.EnumDescriptor",
  "!*.Type", "!*.Number", "!*.UnmarshalJSON", "!file_raft_proto*", "!File_raft_proto",
  "!init.*"]

# confstate.go calls into fmt, slices and proto (Clone, Equal); confchange.go into fmt,
# strconv, strings and proto (Marshal); raft.pb.go into the protobuf runtime (names only,
# translated with the etcd project: Code/google_golang_org/protobuf/)
imports = ["fmt", "slices", "strconv", "strings", "google.golang.org/protobuf/proto",
  "google.golang.org/protobuf/runtime/protoimpl",
  "google.golang.org/protobuf/reflect/protoreflect"]

trust_proofgen = true

# translate the definitions of all type declarations goose supports
translate_types = true
