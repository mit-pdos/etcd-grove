  "MsgStorageApply",
  "MsgStorageApplyResp",
  "MsgForgetLeader",

  "ConfChangeI",
  # confchange.go (hand-written): the conf-change helpers. The gogoproto `Marshal`/`Unmarshal`
  # methods they call stay names-only (axiomatized; specs at the trust boundary, `InvCCCodec.lean`)
  "MarshalConfChange",
  "ConfChange.AsV2",
  "ConfChange.AsV1",
  "ConfChangeV2.AsV2",
  "ConfChangeV2.AsV1",
  "ConfChangeV2.EnterJoint",
  "ConfChangeV2.LeaveJoint",
  "ConfChangeTransitionAuto",
  "ConfChangeTransitionJointImplicit",
  "ConfChangeTransitionJointExplicit",

  "EntryNormal",
  "EntryConfChangeV2",
  "EntryConfChange",

  "ConfChangeAddNode",
  "ConfChangeRemoveNode",
  "ConfChangeUpdateNode",
  "ConfChangeAddLearnerNode",
  "Message",

  # the enum constants (alias.go defines the names above as aliases of them)
  "EntryType_*",
  "MessageType_*",
  "ConfChangeTransition_*",
  "ConfChangeType_*",
]

# `ConfState.Equivalent` (confstate.go, hand-written) calls into fmt, reflect and slices;
# `Entry.Size` (raft.pb.go, gogoproto) calls `sovRaft`, which calls `math/bits.Len64`;
# `ConfChangeV2.LeaveJoint` calls gogoproto's `proto.Equal` (names-only)
imports = ["fmt", "reflect", "slices", "math/bits", "github.com/gogo/protobuf/proto"]

trust_proofgen = true

# translate the definitions of all type declarations goose supports
translate_types = true
