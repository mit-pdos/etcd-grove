# `lessor.Recover`. (2026-11-19) the rest of `bucket.go`'s variables and `emptyStorageVersion`, so that
# their initializers are translated (`etc/gen-init.py`), not trust-boundary axioms. (2026-11-19) `UnsafeDeleteLease` with
