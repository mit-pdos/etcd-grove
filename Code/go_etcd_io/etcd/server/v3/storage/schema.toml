# The consistent index's reads and writes (cindex.go) and the names they use, with
# bodies; the auth backend (auth.go, auth_users.go, auth_roles.go) with bodies, with the
# auth buckets, their names and the two key names (2026-10-23, the auth plan's S1:
# notes/auth-plan.md); the `Key` bucket (the mvcc store's) and the `bucket` type's methods (bucket.go,
# with bodies: the backend's `Bucket` interface on schema's buckets); the rest of the
# package is names only. The alarm and auth backends' constructors (`NewAlarmBackend`,
# `NewAuthBackend`) with bodies, and (with `zap`, `auth`, `etcdserverpb` among the imports) their
# structs `alarmBackend`/`authBackend` with fields (2026-10-17, unit N4: the server's
# construction states that they wrap its backend). The lessor's `Lease` bucket and its name
# (2026-10-25, leases T3: notes/leases-plan.md).
translate = ["!*", "UnsafeReadConsistentIndex", "ReadConsistentIndex", "UnsafeUpdateConsistentIndex", "UnsafeUpdateConsistentIndexForce", "unsafeUpdateConsistentIndex", "Meta", "MetaConsistentIndexKeyName", "MetaTermKeyName", "UnsafeCreateMetaBucket", "Key", "keyBucketName", "metaBucketName", "bucket.ID", "bucket.Name", "bucket.String", "bucket.IsSafeRangeBucket", "NewAlarmBackend", "NewAuthBackend",
