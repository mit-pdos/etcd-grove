# Types and names only, except the lessor's methods the KV store calls (`GetLease`, `Attach`,
# `Detach`, `Lookup`, `SetRangeDeleter`; lessor.go, unit 8 of the backend) and those the apply
# thread calls (`Grant`, `Revoke`, `Checkpoint`, `Demote`, `ExpiredLeasesC`, with their callees in
# lessor.go, lease.go and lease_queue.go; unit 9), with bodies; (the lease-read plan, 2026-10-31)
# `Leases` (the server's `LeaseLeases`), with its sort's `leasesByExpiry` and `Remaining`.
# (pgaps, 2026-11-21) `scheduleCheckpointIfNeeded`, with its body (`int64(d.Seconds())`: Perennial
# steps a float-to-integer conversion to an arbitrary integer). Names only: the rest.
# Lessor is an interface (the apply thread calls its Promote), so the packages its methods'
# signatures name are imported (Checkpointer's context and request type, Recover's backend).
# `sync` for the struct `Lease` (its locks), whose `ID` the server's apply package reads;
# `zap` and `semver` for the struct `lessor` (its logger, its cluster's version); `container/heap`
# (names only) for the expiry notifier's queue; `leasepb` and `schema` for `persistTo` and
# `Revoke`'s writes; `version` for `shouldPersistCheckpoints`; prometheus for the metrics.
translate = ["!*",
  # (etcdstorage, 2026-11-20) metrics.go's `init.0` (`prometheus.MustRegister` of the metrics), translated:
  # proved by `etc/gen-init.py` over `MustRegister`'s spec with the names' registration rights (the
  # user's decision, 2026-11-20: mvccrand's and mvccfull's closed theorems take `namesUnclaimed`)
  "init.0",
  # (metric-inits, 2026-11-19) metrics.go: metrics of an options literal, over prometheus's constructor specs
  "leaseGranted", "leaseRevoked", "leaseTotalTTLs", "Lessor", "NoLease", "MaxLeaseTTL", "forever", "ErrNotPrimary", "ErrLeaseNotFound",
  "ErrLeaseExists", "ErrLeaseTTLTooLarge",
  "lessor.GetLease", "lessor.Attach", "lessor.Detach", "lessor.Lookup", "lessor.SetRangeDeleter",
  "lessor.isPrimary", "lessor.scheduleCheckpointIfNeeded", "lessor.Grant", "lessor.Revoke", "lessor.Checkpoint",
  "lessor.shouldPersistCheckpoints", "greaterOrEqual", "lessor.Demote", "lessor.ExpiredLeasesC",
  # (prove-ps2-lease, 2026-11-21) `Stop`, with its body: proved over broadcast channels (`lessorStopTok`)
  "lessor.Stop",
  # (prove-ps2-renew, 2026-11-21) `Renew`, with its body, and its `Lease.expired` (stepped into by
  # `Renew`'s proof): proved (its select's three receives through close-once channel invariants, `onceRecv`)
  "lessor.Renew", "Lease.expired",
  # (prove-ps2-promote, 2026-11-21) `Promote`, with its body: proved (a fresh close-once `demotec`
  # swapped in through `demoteOuter`; the sort of `leasesByExpiry` with the level-0 token)
  "lessor.Promote",
  "lessor.clearScheduledLeasesCheckpoints", "lessor.clearLeaseExpiredNotifier",
  "NewLease", "Lease.persistTo", "Lease.TTL", "Lease.getRemainingTTL", "Lease.refresh",
  "Lease.forever", "Lease.Keys",
  "lessor.Leases", "lessor.unsafeLeases", "leasesByExpiry", "leasesByExpiry.Len",
  "leasesByExpiry.Less", "leasesByExpiry.Swap", "Lease.Remaining",
  "LeaseQueue.Len", "LeaseQueue.Less", "LeaseQueue.Swap", "LeaseQueue.Push", "LeaseQueue.Pop",
  "newLeaseExpiredNotifier", "LeaseExpiredNotifier.RegisterOrUpdate",
  # (prove-ps2-newlessor3, 2026-11-21) the constructor and the expiry loop, with their bodies:
  # `NewLessor.spec` proved over them (one trust-boundary axiom left, `Lease.expired`'s payload,
  # `lease.expiredPayload`), with the notifier's `Len`, `Peek`, `Unregister`
  "NewLessor", "newLessor", "lessor.runLoop", "lessor.revokeExpiredLeases",
  "lessor.checkpointScheduledLeases", "lessor.findExpiredLeases", "lessor.expireExists",
  "lessor.findDueScheduledCheckpoints",
  "LeaseExpiredNotifier.Len", "LeaseExpiredNotifier.Peek", "LeaseExpiredNotifier.Unregister",
  # the lease-expiry plan's S1 (2026-11-03, the user's): the snapshot's restore, proved
  "lessor.Recover", "lessor.initAndRecover", "LeaseExpiredNotifier.Init",
  # (prove-errinits, 2026-11-19) the remaining package variables: constants and a counter
  "defaultLeaseRevokeRate", "leaseCheckpointRate", "defaultLeaseCheckpointInterval",
  "maxLeaseCheckpointBatchSize", "defaultExpiredleaseRetryInterval", "leaseRenewed"]
imports = ["!*", "container/heap", "context", "sort", "sync", "time", "errors", "math",
  "go.etcd.io/etcd/api/v3/etcdserverpb", "go.etcd.io/etcd/api/v3/version",
  "go.etcd.io/etcd/server/v3/lease/leasepb",
  "go.etcd.io/etcd/server/v3/storage/backend", "go.etcd.io/etcd/server/v3/storage/schema",
  "go.uber.org/zap", "github.com/Masterminds/semver/v3",
