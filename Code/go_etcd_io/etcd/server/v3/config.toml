# Types and names only: function and method bodies are axiomatized.
# ServerConfig is a struct (the apply thread reads its fields), so the packages of
# its field types are imported.
translate = ["!*", "ServerConfig", "ServerConfig.ElectionTimeout", "ServerConfig.ReqTimeout",
  # the watch slice's unit W-S: the watch server's request-size budget
  "ServerConfig.MaxRequestBytesWithOverhead", "grpcOverheadBytes",
  # (2026-11-19) proved outright
  "ServerConfig.PeerDialTimeout",
  # (bkarea, 2026-11-22) proved over `datadir.ToBackendFileName` (until then an axiom)
  "ServerConfig.BackendPath"]
imports = ["!*", "time", "go.etcd.io/etcd/server/v3/storage/datadir", "go.uber.org/zap", "go.etcd.io/bbolt", "go.etcd.io/etcd/client/pkg/v3/transport", "go.etcd.io/etcd/client/pkg/v3/types", "go.etcd.io/etcd/pkg/v3/featuregate", "go.etcd.io/etcd/server/v3/etcdserver/api/v3discovery", "go.opentelemetry.io/contrib/instrumentation/google.golang.org/grpc/otelgrpc"]

# translate the definitions of all type declarations goose supports
translate_types = true
