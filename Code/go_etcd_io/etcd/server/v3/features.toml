# Names only, with the feature constants the server reads: the request path's (`PriorityRequest`
# in processInternalRaftRequestOnce, `TxnModeWriteWithSharedBuffer` in Txn), the construction's
# (`LeaseCheckpointPersist`, `LeaseCheckpoint` in NewServer; unit N4, 2026-10-17) and the one
# `v3rpc.newHealthNotifier` reads (`StopGRPCServiceOnDefrag`; item 4, the server start), and
# `LeaseRenew`'s (`FastLeaseKeepAlive`; the lease-renew plan, 2026-11-01).
translate = ["!*", "PriorityRequest", "TxnModeWriteWithSharedBuffer", "LeaseCheckpointPersist",
  "LeaseCheckpoint", "StopGRPCServiceOnDefrag", "FastLeaseKeepAlive",
  # (prove-smallinits, 2026-11-20) `DefaultEtcdServerFeatureGates`, a map literal of
  # `featuregate.FeatureSpec`s, and the features it names (until then `opaqueInitsOk`)
  "DefaultEtcdServerFeatureGates", "InitialCorruptCheck", "CompactHashCheck", "SetMemberLocalAddr",
  "NonBlockingDefrag",
  # (featuregate-3, 2026-11-23; until then the trust-boundary axiom
  # `features.NewDefaultServerFeatureGate.wp_proof`) with its body, over featuregate's `New` and
  # `featureGate.Add` (Code/go_etcd_io/etcd/pkg/v3/featuregate.toml) and `fmt.Sprintf`
  "NewDefaultServerFeatureGate"]
imports = ["!*", "fmt", "go.etcd.io/etcd/pkg/v3/featuregate"]

# translate the definitions of all type declarations goose supports
translate_types = true
