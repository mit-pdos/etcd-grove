# Types and names only, except the auth store's request side (store.go, range_perm_cache.go;
# unit P2), with bodies: `IsAuthEnabled`, `Revision`, the permission checks the KV path calls
# (`IsPutPermitted`, `IsRangePermitted`, `IsDeleteRangePermitted` through `isOpPermitted`,
# `isRangeOpPermitted` and the permission cache's `checkKeyPoint`/`checkKeyInterval`), and
# `IsAdminPermitted`, and `lockedReadTx`, their read transaction of the current backend
# under `beMu`; `AuthInfoFromCtx` (with `authInfoFromToken`), and the error variables
# they return. Names only: `AuthInfoFromTLS` (its peer's `credentials.TLSInfo` and the x509
# chains are axiomatized types), `redactToken` (`crypto/sha256`) and the rest (the admin requests, the token
# providers, `NewAuthStore`).
# AuthStore is an interface (the server's apply package calls its methods, and its value is a
# field of `ApplierOptions` and of the auth applier), so the packages its methods' signatures
# name are imported (`Authenticate`'s context and the requests and responses, `Recover`'s
# backend: `AuthBackend`'s users and roles); `sync`, `zap` and `adt` for the struct `authStore`
# (its locks, its logger, the permission cache's interval trees); `strings`, `sync/atomic`,
# grpc's `metadata` and `rpctypes` for the request side's bodies.
translate = ["!*", "AuthInfo",
  "authStore.IsAuthEnabled", "authStore.Revision",
  "authStore.isOpPermitted", "authStore.IsPutPermitted", "authStore.IsRangePermitted",
  "authStore.IsDeleteRangePermitted", "authStore.IsAdminPermitted", "authStore.lockedReadTx",
  "authStore.isRangeOpPermitted", "checkKeyPoint", "checkKeyInterval", "isOpenEnded",
  "getMergedPerms", "authStore.refreshRangePermCache", "isValidPermissionRange",
  "authStore.AuthInfoFromCtx", "authStore.authInfoFromToken",
  "ErrUserEmpty", "ErrUserNotFound", "ErrPermissionDenied", "ErrAuthOldRevision",
  "ErrInvalidAuthToken",
  # The admin side (the auth plan's S4, 2026-10-24): the store's write methods, their helpers
  # (`commitRevision`, `setRevision`, `hasRootRole`, `permSlice`'s sorter), the constants
  # `rootUser`/`rootRole` (names-only constants are values of unknown shape) and the error
  # variables they return; `selectPassword` stays names only (bcrypt and base64: the trust
  # boundary), as do `Authenticate`/`CheckPassword` (S5) and `NewAuthStore`.
  "authStore.AuthEnable", "authStore.AuthDisable", "authStore.Recover",
  "authStore.UserAdd", "authStore.UserDelete", "authStore.UserChangePassword",
  "authStore.UserGrantRole", "authStore.UserGet", "authStore.UserList", "authStore.UserRevokeRole",
  "authStore.RoleGet", "authStore.RoleList", "authStore.RoleRevokePermission",
  "authStore.RoleDelete", "authStore.RoleAdd", "authStore.RoleGrantPermission",
  "authStore.HasRole", "authStore.commitRevision", "authStore.setRevision",
  # `hasRootRole` with its body since Perennial's `sort.SearchStrings` spec (beb785eaf, the auth
  # plan's S4b, 2026-10-24)
  "hasRootRole",
  "permSlice.Len", "permSlice.Less", "permSlice.Swap", "rootUser", "rootRole",
  "ErrRootUserNotExist", "ErrRootRoleNotExist", "ErrUserAlreadyExist", "ErrRoleAlreadyExist",
  "ErrRoleNotFound", "ErrRoleEmpty", "ErrPermissionNotGiven", "ErrNoPasswordUser",
  "ErrRoleNotGranted", "ErrPermissionNotGranted", "ErrInvalidAuthMgmt",
  # The token binding (the auth plan's S5, 2026-10-24): `Authenticate` (its token from the
  # provider's `assign`) and the error variables it returns; the no-op provider (`nop.go`);
  # `CheckPassword` stays names only (bcrypt), as do the simple and JWT providers.
  "authStore.Authenticate", "ErrAuthFailed", "ErrAuthNotEnabled",
  "tokenNop.enable", "tokenNop.disable", "tokenNop.invalidateUser", "tokenNop.genTokenPrefix",
  "tokenNop.info", "tokenNop.assign",
  # The simple token provider (the auth plan's S5b, 2026-10-24): its methods with bodies, the TTL
  # keeper's map helpers and the TTL default `enable` reads; names only: `isValidSimpleToken`
  # (`strconv.ParseUint`, which Perennial does not translate), the keeper's `run` and `stop` (a
  # `time.Ticker`, `Time.After`, the channel protocol between them), `genTokenPrefix`
  # (`crypto/rand`, `math/big`) and `redactToken` (`crypto/sha256`, the panic branch).
  "newTokenProviderSimple", "tokenSimple.info", "tokenSimple.assign",
  "tokenSimple.assignSimpleTokenToUser", "tokenSimple.invalidateUser", "tokenSimple.enable",
  "tokenSimple.disable", "simpleTokenTTLKeeper.addSimpleToken",
  "simpleTokenTTLKeeper.resetSimpleToken", "simpleTokenTTLKeeper.deleteSimpleToken",
  "simpleTokenTTLDefault", "AuthenticateParamIndex", "AuthenticateParamSimpleTokenPrefix",
  # (the auth plan's S5c, 2026-10-25, Perennial 24bef275e: `strconv.ParseUint`, `time.Ticker`,
  # `Time.After`) the token check and the TTL keeper's goroutine and its stop
  "tokenSimple.isValidSimpleToken", "simpleTokenTTLKeeper.run", "simpleTokenTTLKeeper.stop",
  "simpleTokenTTLResolution"]
imports = ["!*", "bytes", "context", "errors", "fmt", "sort", "strconv", "strings", "time", "sync", "sync/atomic",
  "go.uber.org/zap", "google.golang.org/grpc/metadata",
  "go.etcd.io/etcd/api/v3/etcdserverpb", "go.etcd.io/etcd/api/v3/authpb",
  "go.etcd.io/etcd/api/v3/v3rpc/rpctypes", "go.etcd.io/etcd/pkg/v3/adt"]

# translate the definitions of all type declarations goose supports
translate_types = true
