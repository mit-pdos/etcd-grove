# (etcd-dist D2, 2026-11-24) Names only: the multi-machine server (examples/etcd/dist/server) calls
# `NewPeerHandler` (etcd's peer handler: raft, leases, members), whose spec is the phase 7 S5 boundary's.
# (prove-t18, 2026-11-26) health.go's metrics (`healthSuccess`, `healthFailed`: `prometheus.NewCounter`;
# `healthCheckGauge`: `NewGaugeVec`; `healthCheckCounter`: `NewCounterVec`) and its `init.0`
# (`prometheus.MustRegister` of the four), translated: proved by `etc/gen-init.py` over prometheus's
# constructor specs and `MustRegister`'s, with the names' registration rights (until then the
# trust-boundary axioms `opaqueInitsOk` and `initFuncsOk`).
translate = ["!*", "healthSuccess", "healthFailed", "healthCheckGauge", "healthCheckCounter", "init.0"]
imports = ["!*", "github.com/prometheus/client_golang/prometheus"]

# translate the definitions of all type declarations goose supports
translate_types = true
