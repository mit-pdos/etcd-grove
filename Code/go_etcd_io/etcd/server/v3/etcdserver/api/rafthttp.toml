# rafthttp's message path with bodies (D38, `notes/rafthttp-plan.md` stage 1, 2026-10-22): the
# transport, peers, stream writers and readers, the pipeline, remotes, the pipeline and stream
# handlers, the two codecs, the URL picker, the peer status and the request helpers; (2026-10-24,
# stage 7c) the snapshot stream (the sender, its handler, `SendSnapshot`, `peer.sendSnap`). Names
# only: the probes, the package variables' initializers, and the round
# trippers' and listener's constructors (the HTTP boundary's). (const-inits, 2026-11-19) The
# initializers of constants, `fmt.Errorf` errors and literals translated: the timeouts and
# intervals (`snapResponseReadTimeout`, `ConnWriteTimeout`, `proberInterval`, ...),
# `errMemberNotFound` and `supportedStream`. (metric-vecs, 2026-11-19) The metric vectors'
# initializers translated (metrics.go), over prometheus's `New<Kind>Vec` specs.
translate = ["*",
  # (mustreg, 2026-11-20) metrics.go's `init.0` (`prometheus.MustRegister` of the metrics), translated (no longer
  # `!init.*`):
  # proved by `etc/gen-init.py` over `MustRegister`'s spec with the names' registration rights
  "!addPeerToProber", "!monitorProbingStatus",
  "!NewListener", "!NewRoundTripper", "!newStreamRoundTripper",
  # (prove-errinits, 2026-11-19) the `errors.New`/`fmt.Errorf` errors translated (until then
  # untranslated, the axiom `errorsNewVarsInit`); (prove-misc, 2026-11-20) `linkHeartbeatSize`'s
  # initializer (`proto.Size`) translated, over `proto.SizePb`'s spec (until then the axiom
  # `linkHeartbeatSize_init`)
  ]
# (2026-10-24, rafthttp stage 6d) `ProbingPrefix`, `RaftStreamPrefix` and `RaftSnapshotPrefix`
# translated: `path.Join(RaftPrefix, ...)`, their values facts of `rafthttpInit`
imports = ["!*", "bytes", "context", "encoding/binary", "errors", "fmt", "io", "net", "net/http",
  "net/url", "path", "runtime", "strings", "sync", "time",
  "github.com/Masterminds/semver/v3", "github.com/dustin/go-humanize",
  "github.com/prometheus/client_golang/prometheus", "github.com/xiang90/probing",
  "go.etcd.io/etcd/api/v3/version", "go.etcd.io/etcd/client/pkg/v3/transport",
  "go.etcd.io/etcd/client/pkg/v3/types", "go.etcd.io/etcd/pkg/v3/httputil",
  "go.etcd.io/etcd/pkg/v3/pbutil", "go.etcd.io/etcd/pkg/v3/ioutil",
  "go.etcd.io/etcd/server/v3/etcdserver/api/snap",
  "go.etcd.io/etcd/server/v3/etcdserver/api/v2stats", "go.etcd.io/raft/v3",
  "go.etcd.io/raft/v3/raftpb", "go.uber.org/zap", "golang.org/x/time/rate",
  "google.golang.org/protobuf/proto"]

# translate the definitions of all type declarations goose supports
translate_types = true
