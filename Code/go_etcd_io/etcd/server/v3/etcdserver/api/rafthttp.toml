# Types and names only: function and method bodies are axiomatized. The packages the
# `Transporter` interface's method set names are imported (the raft wrapper's transport, and
# the request path's unit 2: the server's `parseProposeCtxErr` loads `s.r.transport`;
# otherwise an axiomatized type).
translate = ["!*"]
imports = ["!*", "net/http", "time", "go.etcd.io/raft/v3/raftpb", "go.etcd.io/etcd/server/v3/etcdserver/api/snap", "go.etcd.io/etcd/client/pkg/v3/types"]

# translate the definitions of all type declarations goose supports
translate_types = true
