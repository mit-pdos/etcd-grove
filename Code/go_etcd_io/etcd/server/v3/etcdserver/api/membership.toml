# Types (with the packages of `RaftCluster`'s and `Member`'s field types imported), the
# server's helpers `ShouldApplyV3`, `ApplyBoth`, `ApplyV2storeOnly`, and the request path's
# `RaftCluster.ID`, `RaftCluster.Members` with what it calls (unit P1b, 2026-10-14) with bodies;
# the rest names only.
translate = ["!*",
  # (metric-vecs, 2026-11-19) metrics.go: the cluster version's gauge vector, over prometheus's `NewGaugeVec` spec
  "ClusterVersionMetrics",
  "ShouldApplyV3", "ApplyBoth", "ApplyV2storeOnly", "RaftCluster.ID",
  "RaftCluster.Members", "Member.Clone",
  # (prove-srvloops, 2026-11-21) the leader lookup of the server's `waitLeader`
  "RaftCluster.Member", "MembersByID.Len", "MembersByID.Less", "MembersByID.Swap",
  # the mutex's methods, promoted through the embedded `sync.Mutex` (`MethodUnfold` wrappers)
  "RaftCluster.Lock", "RaftCluster.Unlock",
  # (D21 M2) `Process`'s check of the sender
  "RaftCluster.IsIDRemoved",
  # (D43 M4) the request path's learner check (the fork's: no panic for a removed local member);
  # the server's `IsMemberExist` (the stream interceptor's check)
  "RaftCluster.IsLocalMemberLearner", "RaftCluster.IsMemberExist",
  # (D43 M4) the membership writer of a removal (its metric update names only)
  "RaftCluster.RemoveMember",
  # (D43 M5b) the membership writer of an addition (its metric updates names only)
  "RaftCluster.AddMember",
  # (D43 M4) the validation of a conf change (`json.Unmarshal` of its context names only)
  "RaftCluster.ValidateConfigurationChange",
  # (prove-membership, 2026-11-19) the notifier's setter, proved
  "RaftCluster.SetVersionChangedNotifier",
  # (prove-membership, 2026-11-19) the error variables (`errors.go`: `errors.New` calls), translated
  "ErrIDRemoved", "ErrIDExists", "ErrIDNotFound", "ErrPeerURLexists", "ErrMemberNotLearner",
  "ErrTooManyLearners",
  # (prove-errinits, 2026-11-19) the remaining package variables: the metrics `knownPeers` (a gauge
  # vector) and `isLearner`, and the store paths (`path.Join` of `storePrefix`)
  "knownPeers", "isLearner", "storePrefix", "StoreMembersPrefix", "storeRemovedMembersPrefix",
  # (mustreg, 2026-11-20) metrics.go's `init.0` (`prometheus.MustRegister` of the metrics), translated:
  # proved by `etc/gen-init.py` over `MustRegister`'s spec with the names' registration rights
  "init.0",
  # (prove-ps2-members, 2026-11-22) the backend's setter (`applySnapshot`'s), proved
  "RaftCluster.SetBackend"]
imports = ["!*", "errors", "path", "sort", "sync", "go.uber.org/zap", "go.etcd.io/raft/v3/raftpb", "encoding/json", "go.etcd.io/etcd/client/pkg/v3/types", "github.com/Masterminds/semver/v3", "go.etcd.io/etcd/pkg/v3/notify", "go.etcd.io/etcd/server/v3/etcdserver/version",
  # (metric-vecs, 2026-11-19) `ClusterVersionMetrics`' translated initializer
  "github.com/prometheus/client_golang/prometheus"]

# translate the definitions of all type declarations goose supports
translate_types = true
