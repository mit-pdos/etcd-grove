# The Lock service's server (lock.go), with bodies (the auth plan's A3c, 2026-10-24): `lockServer`,
# `NewLockServer`, `Lock` (a session over the request's lease, a mutex on the request's name) and
# `Unlock` (a delete of the request's key), over the client's `concurrency` package and the
# client's KV.
translate = ["!*", "lockServer", "NewLockServer", "lockServer.Lock", "lockServer.Unlock"]
imports = ["!*", "context", "go.etcd.io/etcd/client/v3", "go.etcd.io/etcd/client/v3/concurrency",
  "go.etcd.io/etcd/server/v3/etcdserver/api/v3lock/v3lockpb"]

# translate the definitions of all type declarations goose supports
translate_types = true
