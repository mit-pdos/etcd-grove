# Types and names only: function and method bodies are axiomatized. (D22 S-h, 2026-10-20) `io` and
# raftpb imported, so that `Message` (a raft message, its reader, its size, its `closeC`) is a
# translated struct: `sendMergedSnap` reads its `TotalSize` field.
# (2026-10-24, rafthttp stage 7d) `Message`'s `GetTo`, promoted from its embedded raft message:
# `Transport.SendSnapshot` looks up the peer it names.
# (2026-11-19) `Message`'s `CloseNotify` and `CloseWithError` with their bodies (their specs proved
# over `msgIs`'s definition, `Proof/.../snap/Defs.lean`).
translate = ["!*", "New", "Message.GetTo", "Message.CloseNotify", "Message.CloseWithError",
  # (prove-errinits, 2026-11-19) the package variables: an `errors.New` error and the metrics
  "ErrNoDBSnapshot", "snapMarshallingSec", "snapSaveSec", "snapFsyncSec", "snapDBSaveSec",
  "snapDBFsyncSec",
  # (mustreg, 2026-11-20) metrics.go's `init.0` (`prometheus.MustRegister` of the metrics), translated:
  # proved by `etc/gen-init.py` over `MustRegister`'s spec with the names' registration rights
  "init.0"]
imports = ["!*", "errors", "io", "github.com/prometheus/client_golang/prometheus",
  "go.etcd.io/raft/v3/raftpb",
  # (claim #34 stage 4) `New`'s `zap.NewNop`
  "go.uber.org/zap"]

# translate the definitions of all type declarations goose supports
translate_types = true
