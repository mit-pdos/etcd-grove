# Types and names only: function and method bodies are axiomatized.
# The messages the cache reads are listed explicitly: translate_types never translates
# a struct with a field of another package's alias type, as every protobuf message
# has (`state protoimpl.MessageState`, ...).
# For `client/v3/concurrency` (`waitDelete` compares an event's type with `Event_DELETE`): the
# event type constants.
# k8s 7f-5a-P: `Event.IsCreate` (the etcd3 watcher's `parseEvent`, called through the client's alias
# `clientv3.Event`) with the getters it reads and the constant `PUT`.
translate = ["!*", "KeyValue", "Event", "Event_PUT", "Event_DELETE", "PUT", "Event.IsCreate",
  "Event.GetType", "Event.GetKv", "KeyValue.GetCreateRevision", "KeyValue.GetModRevision",
  # (etcd-small-3, 2026-11-23) `Event_EventType.String`'s trusted model reads the enum's name table
  "Event_EventType_name"]
imports = ["!*", "google.golang.org/protobuf/runtime/protoimpl"]

# translate the definitions of all type declarations goose supports
# (etcd-grove#32, 2026-11-22) the `init` function (the file descriptor's registration) trusted:
# a model that does nothing (TrustedCode/go_etcd_io/etcd/api/v3/mvccpb.lean; until then names-only, the axiom `initFuncsOk`)
# (etcd-small-3, 2026-11-23) `Event_EventType.String` trusted: its model looks the value up in
# `Event_EventType_name` (translated), else `strconv.Itoa`, as protobuf-go's `EnumStringOf` (the
# model's docstring says why that is Go's); until then names-only, the trust-boundary axiom
# `mvccpb.Event_EventType.StringPtr.wp_proof` (over the pointer receiver)
trusted = ["init.0", "Event_EventType.String"]
translate_types = true

# --- skipped package variables (mit-pdos/etcd-grove#23) ---
# Not translated: no Lean name, no initializer, no allocation (goose `[[skip]]`; until 2026-11-22
# their initializers were untranslated, `opaqueInitsOk`). goose refuses a reference to one from
# translated code, so no verified code reads them; each reason says why not running the
# initializer is unobservable.
[[skip]]
names = ["Event_EventType_value", "file_kv_proto_enumTypes",
  "file_kv_proto_msgTypes", "file_kv_proto_goTypes", "file_kv_proto_depIdxs"]
reason = """
Literals: composite literals, conversions and allocations (`make`, `new`, `&T{}`) of constants,
function values (built, not called) and other package variables' values or addresses, with no call.
Each terminates, cannot panic (its sizes, indices and keys are constants the compiler checks) and
has no effect beyond its variable."""
# --- end of skipped package variables ---
