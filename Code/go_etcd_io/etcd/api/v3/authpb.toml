# authpb is protobuf-go v2 (auth.pb.go generated by protoc-gen-go): the messages `User`,
# `Role`, `Permission`, `UserAddOptions` are structs read through getters, the enum
# `Permission_Type` has `Enum()`. The messages' types and getters and the enum are translated
# (2026-10-23, the auth plan's S1: the auth backend's records are the model's data,
# `notes/auth-plan.md`; until then types and names only, with the permission types, unit P2);
# the protobuf runtime plumbing is names only, as raftpb's (`Code/go_etcd_io/raft/v3/raftpb.toml`):
# `ProtoReflect`, `Descriptor`, `Reset`, `String`, `ProtoMessage`, the enum's `Type`/`Number`/
# `EnumDescriptor`, the file descriptor and its tables (`file_auth_proto*`, `File_auth_proto`)
# and `init` (`initFuncsOk`, `opaqueInitsOk` of the package's generated `Init.lean`). The enum's
# name maps `Permission_Type_name`/`_value` are translated (2026-10-24, the auth plan's S4e:
# `RoleGrantPermission` looks the granted type's name up; the package's fact, `authpbInit`).
translate = ["*",
  "!*.ProtoReflect", "!*.Descriptor", "!*.Reset", "!*.String", "!*.ProtoMessage",
  "!*.EnumDescriptor", "!*.Type", "!*.Number", "!file_auth_proto*", "!File_auth_proto",
  "!init.*"]

# auth.pb.go imports the protobuf runtime (names only, translated with this project:
# Code/google_golang_org/protobuf/)
imports = ["google.golang.org/protobuf/runtime/protoimpl",
  "google.golang.org/protobuf/reflect/protoreflect"]

trust_proofgen = true

# translate the definitions of all type declarations goose supports
translate_types = true
