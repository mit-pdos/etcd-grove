# Everything (prove-rpcmap, 2026-11-20): the functions `Error`, `ErrorDesc` and `EtcdError`'s methods
# `Error` and `Code` (unit P3a: the client's `ContextError` and retry interceptor, the cache's
# `WatchResponse.Err` call `Error`), which call grpc's `status.FromError` and `(*Status).Message`/`Code`
# (names only: hence the import of grpc's `status`), and every variable's initializer: the string
# constants (const-inits, 2026-11-19), the `status.Error(codes.X, "...")` errors (prove-rpctypes,
# prove-initmisc, 2026-11-20: over `status.Error`'s spec), the map `errStringToError` (keys
# `ErrorDesc(ErrGRPC*)`) and the client-side `Err* = Error(ErrGRPC*)` (the initializer's proof:
# `etc/gen-init.py`; until then names only, `opaqueInitsOk` and the trust-boundary axioms `<X>_init`).
translate = ["*"]
# `EtcdError`'s field `code` is a `codes.Code`: `client/v3/leasing`'s `acquire` allocates one.
imports = ["!*", "google.golang.org/grpc/codes", "google.golang.org/grpc/status"]

# translate the definitions of all type declarations goose supports
translate_types = true
