# Types and names only: function and method bodies are axiomatized, but (rafthttp stage 6e,
# 2026-10-24) `URLs.Len`, which `rafthttp.setPeerURLsHeader` calls.
# (2026-11-19) `ID.String`, proved over `strconv.FormatUint`.
# (prove-smallinits, 2026-11-20) the `var _ Set = (*unsafeSet)(nil)` checks (until then
# `opaqueInitsOk`).
# (prove-ps2-misc, 2026-11-21) `URLs.StringSlice`, proved over `url.URL.String`'s spec
# (`http.URLStringAny_spec`).
# (claim #34 stage 2, 2026-11-25) `URLsMap.String` (`VerifyBootstrap`'s), the ids' sort (`MemberIDs`)
translate = ["!*", "URLs.Len", "URLs.StringSlice", "ID.String", "_", "URLsMap.String", "IDSlice.Len",
  "IDSlice.Less", "IDSlice.Swap"]
# (unit N4, 2026-10-17: `net/url`, so that `URLs` is translated)
imports = ["!*", "net/url", "strconv", "fmt", "sort", "strings"]

# translate the definitions of all type declarations goose supports
translate_types = true
