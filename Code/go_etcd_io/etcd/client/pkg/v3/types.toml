# Types and names only: function and method bodies are axiomatized, but (rafthttp stage 6e,
# 2026-10-24) `URLs.Len`, which `rafthttp.setPeerURLsHeader` calls.
translate = ["!*", "URLs.Len"]
# (unit N4, 2026-10-17: `net/url`, so that `URLs` is translated)
imports = ["!*", "net/url"]

# translate the definitions of all type declarations goose supports
translate_types = true
