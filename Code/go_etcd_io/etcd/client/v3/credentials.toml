# Types and names only: the type of `clientv3.Client`'s field `authTokenBundle`
# (`PerRPCCredentialsBundle`, an interface: the retry interceptor's `shouldRefreshToken` and
# `refreshToken` compare it with `nil`, unit P3a; its method `PerRPCCredentials` names grpc's
# `credentials.PerRPCCredentials`, hence the import of grpc's `credentials`).
#
# With bodies (the auth plan's E2d, 2026-10-25): the bundle `clientv3.New` makes for a client with
# a user name (`NewPerRPCCredentialBundle`) and its `PerRPCCredentials`, which `Client.dial` passes
# to grpc's `WithPerRPCCredentials`; the struct `perRPCCredential` needs `sync` (its lock).
#
# The auth plan's C1 phase 2 (2026-10-28): the bundle's `UpdateAuthToken` (`getToken`'s call) and
# the credentials' `RequireTransportSecurity` (grpc's `NewClient` calls it). (prove-ps2-client,
# 2026-11-22) The credentials' `UpdateAuthToken` with its body: a writer needs only the lock's
# persistent guard (`credTokInv`). (prove-ps2-clientrdlock, 2026-11-24) The credentials'
# `GetRequestMetadata` with its body (a trust-boundary axiom until then: its `RWMutex` read lock,
# `notes/c1-plan.md`, finding 2): its reader slot is borrowed from `credTokInv`'s level-0 pool with
# the caller's `levelTok 0`, which grpc lends it (`perRPCCredsOk pc clientRes`); `rpctypes` for
# `TokenFieldNameGRPC`.
translate = ["!*", "NewPerRPCCredentialBundle", "perRPCCredentialBundle.PerRPCCredentials",
  "perRPCCredentialBundle.UpdateAuthToken", "perRPCCredential.RequireTransportSecurity",
  "perRPCCredential.UpdateAuthToken", "perRPCCredential.GetRequestMetadata"]
imports = ["!*", "google.golang.org/grpc/credentials", "sync", "go.etcd.io/etcd/api/v3/v3rpc/rpctypes"]

# translate the definitions of all type declarations goose supports
translate_types = true
