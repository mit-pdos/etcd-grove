# Types and names only: the type of `clientv3.Client`'s field `authTokenBundle`
# (`PerRPCCredentialsBundle`, an interface: the retry interceptor's `shouldRefreshToken` and
# `refreshToken` compare it with `nil`, unit P3a; its method `PerRPCCredentials` names grpc's
# `credentials.PerRPCCredentials`, hence the import of grpc's `credentials`).
#
# With bodies (the auth plan's E2d, 2026-10-25): the bundle `clientv3.New` makes for a client with
# a user name (`NewPerRPCCredentialBundle`) and its `PerRPCCredentials`, which `Client.dial` passes
# to grpc's `WithPerRPCCredentials`; the struct `perRPCCredential` needs `sync` (its lock).
translate = ["!*", "NewPerRPCCredentialBundle", "perRPCCredentialBundle.PerRPCCredentials"]
imports = ["!*", "google.golang.org/grpc/credentials", "sync"]

# translate the definitions of all type declarations goose supports
translate_types = true
