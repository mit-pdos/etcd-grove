# Types and names only: function and method bodies are axiomatized, except for what the
# cache's proofs call: `WatchResponse.IsProgressNotify` and the event-type constants (the
# store), `GetPrefixRangeEnd` with `getPrefix` and `noPrefixEnd` (`Cache.validateRange`), and
# the `Op` getters `Cache.validateGet`/`validateWatch` read (with `Rev`, `IsSerializable` and
# `IsProgressNotify`, for `Cache.Get`/`Watch`), and what builds the `Op` of a `Get`
# (`OpGet` with `NewOp`, `applyOpts`, `IsOptsWithPrefix`/`IsOptsWithFromKey`, and the
# options `Cache.Get`'s callers and `Cache.serverRevision` pass), and for `Cache.Watch`:
# `OpWatch`, the watch options `WithProgressNotify`/`WithCreatedNotify`, and
# `WatchResponse.Err` (which calls `rpctypes.Error` and grpc's `status.Error`: hence the
# imports of `rpctypes` and grpc's `codes`/`status`, names only); and the `Client` struct
# (`cache.newCache` reads its `KV` and `Watcher` fields), whose other fields need the types
# of grpc, grpc's `credentials`, zap, `sync/atomic` and the client's `credentials` and
# `internal/resolver` (names only, their `.toml`s; translating `Client` also translates the
# client's structs whose field types these provide: `authClient`, `kv`, `watcher`, ...).
translate = [
  "!*",
  "WatchResponse.IsProgressNotify",
  "EventTypeDelete",
  "EventTypePut",
  "GetPrefixRangeEnd",
  "getPrefix",
  "noPrefixEnd",
  "Op.IsCountOnly",
