# options `Cache.Get`'s callers and `Cache.serverRevision` pass), and for `Cache.Watch`:
# `OpWatch`, the watch options `WithProgressNotify`/`WithCreatedNotify`, and
# `WatchResponse.Err` (which calls `rpctypes.Error` and grpc's `status.Error`: hence the
