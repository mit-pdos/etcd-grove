# `MustUnmarshalMessage` (the apply thread) and `MustMarshalMessage` (rafthttp's message encoder)
# with their bodies; the rest names only.
translate = ["!*", "MustUnmarshalMessage", "MustMarshalMessage"]
imports = ["!*", "fmt", "google.golang.org/protobuf/proto"]

# translate the definitions of all type declarations goose supports
translate_types = true
