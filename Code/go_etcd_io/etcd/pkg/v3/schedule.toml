# The FIFO scheduler with bodies: the jobs (`NewJob`, `job`'s `Name`/`Do`: mvcc's compaction makes
# its jobs with `NewJob`) and the `fifo` scheduler's constructor and the methods etcd calls
# (`NewFIFOScheduler`, `Schedule`, `Stop`, the worker `run`, `executeJob`). `Pending`,
# `Scheduled`, `Finished` and `WaitFinish` (tests and metrics only) are names only.
translate = ["!*", "NewJob", "job.Name", "job.Do", "NewFIFOScheduler", "fifo.Schedule",
  "fifo.Stop", "fifo.run", "fifo.executeJob"]
imports = ["!*", "context", "sync", "go.uber.org/zap", "go.etcd.io/etcd/client/pkg/v3/verify"]

# translate the definitions of all type declarations goose supports
translate_types = true
