# (featuregate-3, 2026-11-23; until then types and names only, with the `prerelease` constants
# `features.DefaultEtcdServerFeatureGates` names, prove-smallinits 2026-11-20) What
# `features.NewDefaultServerFeatureGate` runs, with bodies: `New` (over `maps.Clone`, `zap.NewNop`,
# `atomic.Value.Store`), `featureGate.Add` (over `maps.Copy`, `atomic.Value.Load`/`Store`, `sync.Mutex`,
# `fmt.Errorf`) and `featureGate.Enabled` (the server's `Enabled` calls), with the package variables
# `New` reads (`defaultFeatures`, `specialFeatures`: map literals of constants and function values)
# and the constants they name. The other functions and methods stay names only.
translate = ["!*", "Alpha", "Beta", "GA", "Deprecated", "allAlphaGate", "allBetaGate",
  "defaultFeatures", "specialFeatures", "New", "featureGate.Add", "featureGate.Enabled"]
imports = ["!*", "flag", "fmt", "maps", "sync", "sync/atomic", "go.uber.org/zap"]

# translate the definitions of all type declarations goose supports
translate_types = true

# --- skipped package variables (mit-pdos/etcd-grove#23) ---
# Not translated: no Lean name, no initializer, no allocation (goose `[[skip]]`; until 2026-11-22
# their initializers were untranslated, `opaqueInitsOk`). goose refuses a reference to one from
# translated code, so no verified code reads them; each reason says why not running the
# initializer is unobservable.
[[skip]]
names = ["_@feature_gate.go:167"]
reason = """
An interface check: `&featureGate{}` converted to `pflag.Value`. No call, no panic, no effect."""
# --- end of skipped package variables ---
