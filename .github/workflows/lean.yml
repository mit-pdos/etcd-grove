name: Lean

# Runs on the self-hosted `coqdev` runner, as mit-pdos/xv6iris's Lean CI does.
# The runner is persistent and shared with other repositories' jobs, which is
# what most of the choices below are about.

on:
  push:
    branches: ["lean"]
  pull_request:
    branches: ["lean"]
  # allow running action manually.
  workflow_dispatch:

# A new push does not cancel the run in progress: it waits as pending, and
# GitHub keeps at most one pending run per group, so a burst of pushes
# coalesces into one build of the latest commit. (Cancelling in progress would
# starve CI whenever pushes come faster than a build, and the runner queues
# behind other repositories' jobs anyway.)
concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: coqdev
    # A full build from nothing (Perennial and Iris included) is well under an
    # hour on the runner; three hours means something hung.
    timeout-minutes: 180

    # `bash` selects `bash --noprofile --norc -eo pipefail {0}`; the default
    # shell has no pipefail.
    defaults:
      run:
        shell: bash

    steps:
      # checkout's `git clean -ffdx` empties .lake/ (it is .gitignored), so
      # every run starts with no build products; the dependencies come back
      # through the cache below.
      - uses: actions/checkout@v5

      # elan lives in $HOME/.elan on the runner and persists across runs (and is
      # shared with other jobs there), so it is installed only if absent, and
      # without editing the runner's dotfiles. The toolchain of `lean-toolchain`
      # is installed by elan on first use and is then simply there.
      - name: Install elan (if absent)
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              | sh -s -- -y --no-modify-path --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install the pinned Lean toolchain
        run: |
          elan toolchain install "$(tr -d '[:space:]' < lean-toolchain)"
          lake --version
      # The dependencies (Perennial, Iris, Batteries, Qq), built. Restored from
      # the newest run with the same pins and saved after every run, so a build
      # of them that fails part-way is not lost; this repository's own modules
      # are always built from scratch, so the build report covers all of them.
      # Scoped to runner.name: nothing here is known to be relocatable across
      # runners with different workspace paths.
      - name: Restore dependencies
        uses: actions/cache/restore@v4
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.name }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.run_id }}
          restore-keys: |
            lake-packages-${{ runner.os }}-${{ runner.name }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-
      # On a cache miss (a new pin: the key hashes lake-manifest.json) there is no .lake/packages
      # until the build, but the checks below read Perennial's sources (etc/gen-init.py, loaded by
      # etc/copy-part.py: Perennial's translations). Clone what the manifest pins, without
      # updating it or building; a no-op on a cache hit.
      - name: Fetch dependencies
        run: lake env true
      # etcd's go.mod (the fork pinned in etc/goose.py) asks for Go 1.27.
      # (Any 1.27; `etc/goose.py` itself runs `go` with its pinned GOTOOLCHAIN.)
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: false
      # Before the (long) build: the checked-in translations in `Code/` and `GeneratedProof/`
      # must be exactly what the pinned Perennial's translator produces from the pinned
      # etcd-raft and etcd.
      - name: Check the Goose translation
        run: ./etc/goose.py --check
      # The k8s etcd3 driver's copy of Kubernetes' checker (`examples/k8s/etcd3/correctness`) is
      # upstream's at the driver's `k8s.io/apiserver` pin plus `etc/k8s-correctness/d30g.patch`,
      # byte for byte (k8s 7g, `notes/k8s-7g-scope.md` §1.1). Reads the sources and the module.
      - name: Check the k8s checker copy
        run: ./etc/k8s-correctness-check.py
      # No robustness theorem's program reports a violation by exiting: under `Robust` an exit is a
      # safe run (Perennial models `syscall.Exit` as `AngelicExit`), so a check must panic. Every exit
      # in the programs' own code (under `examples/`) has its reason in `etc/exit-allow.txt`.
      - name: Check the robustness programs' exits
        run: ./etc/exit-check.py
      # `RaftTla/` (raft's `with_tla` build, for the trace check) compiles the main tree's raft
      # specs and proofs again: its copies must be what `etc/gen-raft-tla.py` generates from them.
      # Reads the sources only.
      - name: Check RaftTla's generated copies
        run: ./etc/gen-raft-tla.py --check
      # `RaftNoAx/` (raft without hand-written axioms, notes/raft-noax-part.md) copies the main
      # tree's modules its closed theorem reaches raft through, and `KvNet/` (notes/kvnet-part.md)
      # RaftNoAx's, Net's, WalTester's and the main tree's modules kvnet's closure needs: their
      # copies must be what `etc/copy-part.py` writes from them. Reads the sources only.
      - name: Check RaftNoAx's and KvNet's copies
        run: ./etc/copy-part.py --check
      # Each package's clients import only its importable modules (`etc/api/<pkg>.txt`;
      # CLAUDE.md, "Package APIs"). Reads the sources only.
      - name: Check the packages' importable modules
        run: |
          for c in etc/api/*.txt; do
            ./etc/api-check.py "$c" --check
          done
      # Only the listed modules `import all` a module whose sealed definitions or private laws
      # are part of the trust base (`etc/import-all.txt`: the backend's tracked buckets). Reads
      # the sources only.
      - name: Check the sealed modules' importers
        run: ./etc/import-all-check.py --check
      # The bound reasoning stays with its owners (`notes/bounds-plan.md`, B0): no new
      # thread-bound, receipt-bound or reader-slot premise in a spec. Reads the sources only.
      - name: Check the bounds baseline
        run: ./etc/bounds-check.py --check
      # The auth-mode divergence outside the auth component only goes down (the auth component's
      # stage 2, D2): no new match on a mode, off/on twin or literal mode. Reads the sources only.
      - name: Check the auth-mode baseline
        run: ./etc/mode-check.py --check
      # Every registration on etcd's client port has a row in `etc/auth-table.txt`, with the specs
      # that carry its access check, no row weaker than its baseline (stage M0 of
      # `notes/auth-mediation-scope.md`). Reads the Go sources (`.lake/goose/etcd`, cloned by the
      # Goose check above) and the specs; the tcb.json half is skipped here (no build yet).
      - name: Check the client port's access-control table
        run: ./etc/auth-mediation-check.py --check
      - name: Build
        # `timed-build.py` is `lake build`, recording each module compile's
        # timing for the report below.
        id: build
        run: ./etc/timed-build.py
      - name: Build report
        # Pass or fail (time, parallelism over time, critical path); also on
        # the run's summary page.
        if: always() && steps.build.outcome != 'skipped'
        run: ./etc/build-report.py --markdown-to "$GITHUB_STEP_SUMMARY"
      - name: Save dependencies
        if: always() && steps.build.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.name }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.run_id }}
      - name: Upload build record
        if: always() && steps.build.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: build-record
          path: .lake/build-report/*.jsonl
          if-no-files-found: ignore
      - name: Check the trust base
        run: ./etc/tcb-report.py --check
      # No proof steps into Perennial's `fmt.Errorf` model outside the reviewed modules (reads the
      # .lake/tcb.json the step above wrote).
      - name: Check the fmt.Errorf model steps
        run: ./etc/errorf-wrap-check.py --reuse
