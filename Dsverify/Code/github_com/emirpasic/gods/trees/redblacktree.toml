# (project dsv-epaxos; notes/dsv-epaxos.md) gods v1.18.1's red-black tree, translated but for the
# iterator's Next and Prev, names only: their bodies jump between labels with `goto`, which goose
# does not take. The EPaxos kit's state package iterates a treemap (Select, Iterator, Next): those
# calls reach an untranslated function, so their specs are hypotheses of the proof until a model of
# gods' treemap (the lab's cut-down copy, harness/rpcmodel/gods) is in models/ (not added here).
translate = ["*", "!Iterator.Next", "!Iterator.Prev"]
imports = ["*"]

translate_types = true
