# Types and names only, into the part (notes/dsv-quepaxa.md): the main tree's grpc
# (`Code/google_golang_org/grpc.lean`, project etcd's) imports the main tree's names-only `net`,
# which clashes with the part `Net/`'s; the replica's gRPC calls (`Dial`, `WithInsecure`,
# `NewServer`, `RegisterService`, `Serve`, `Invoke`) are hypotheses of the port until grpc's Lean
# half (models/grpc) is proved over `Net/`.
translate = ["!*"]
imports = ["!*", "context"]
translate_types = true

# no-op models of the initializers (`Dsverify/TrustedCode/google_golang_org/grpc.lean`)
trusted = ["init.0", "init.1", "init.2", "DefaultBackoffConfig", "ErrClientConnClosing", "ErrClientConnTimeout", "ErrServerStopped", "PickFirstBalancerName", "defaultServerOptions", "emptyMethodConfig", "errConnClosing", "errConnDrain", "errConnIdling", "errContextCanceled", "errContextDeadline", "errIllegalHeaderWrite", "errMalformedFrame", "errNoTransportCredsInBundle", "errNoTransportSecurity", "errStreamDone", "errTransportClosing", "errTransportCredentialsMissing", "errTransportCredsAndBundle", "grpcStatusDetailsBinHeader", "http2ErrCodeNames", "http2ErrConvTab", "invalidDefaultServiceConfigErrPrefix", "logger", "metadataFromOutgoingContextRaw", "modelChooseRandom", "statusOK", "transportFailureCodes", "unaryStreamDesc", "_"]
