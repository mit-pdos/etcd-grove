# etc/pbgen.py over etcd's own message types (notes/dsverify-net-port-plan.md, phase 5 item 1): the
# proto3 messages of the KV, lease and watch requests and responses (etcdserverpb, mvccpb, at the
# examples' etcd pin). Only the roots are named here: the codec covers them and every message
# and enum they reach (ResponseHeader, mvccpb.KeyValue and Event, Member, the enums), with
# fields derived from the registered descriptors (netmodels.lab/pbdesc). The generated test
# (pb_gen_test.go) checks the codec against the real google.golang.org/protobuf. What the
# generator refuses of etcd's .proto files (raftpb's proto2 fields, the oneofs of RequestOp,
# ResponseOp, Compare and WatchRequest) is listed in the plan note. Generate from the repository
# root:
#     etc/pbgen.py examples/netmodels/pbetcd/protobuf.toml examples/netmodels/pbetcd --pkg pbetcd
[protobuf]
imports = { etcdserverpb = "go.etcd.io/etcd/api/v3/etcdserverpb", mvccpb = "go.etcd.io/etcd/api/v3/mvccpb" }
roots = ["etcdserverpb.RangeRequest", "etcdserverpb.RangeResponse",
         "etcdserverpb.PutRequest", "etcdserverpb.PutResponse",
         "etcdserverpb.DeleteRangeRequest", "etcdserverpb.DeleteRangeResponse",
         "etcdserverpb.LeaseGrantRequest", "etcdserverpb.LeaseGrantResponse",
         "etcdserverpb.LeaseTimeToLiveResponse",
         "etcdserverpb.WatchCreateRequest", "etcdserverpb.WatchResponse",
         "etcdserverpb.MemberListResponse"]
