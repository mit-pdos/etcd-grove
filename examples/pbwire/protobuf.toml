# models/protobuf/pbgen.py over the proto3 roots of the differential test of the candidate Lean
# wire semantics (Proof/google_golang_org/protobuf/proto/PbWire.lean; vectors_test.go): the codec
# pbMarshal is compared with protobuf-go on every vector of a type in pbgen's subset (no unknown
# fields: pbgen drops them). xpb is a copy of models/internal/pbdifftest/xpb (every scalar kind).
# Generate from the repository root:
#     models/protobuf/pbgen.py examples/pbwire/protobuf.toml examples/pbwire --pkg pbwire
[protobuf]
imports = { xpb = "github.com/mit-pdos/etcd-grove/examples/pbwire/xpb", etcdserverpb = "go.etcd.io/etcd/api/v3/etcdserverpb", leasepb = "go.etcd.io/etcd/server/v3/lease/leasepb", authpb = "go.etcd.io/etcd/api/v3/authpb" }
roots = ["xpb.Kinds", "etcdserverpb.RangeRequest", "etcdserverpb.RangeResponse",
         "etcdserverpb.PutRequest", "etcdserverpb.DeleteRangeRequest",
         "etcdserverpb.LeaseGrantRequest", "etcdserverpb.Member", "etcdserverpb.WatchCreateRequest",
         "leasepb.Lease", "authpb.User", "authpb.Role"]
