# Project bboltfs's `io/fs` (etc/goose.py; Perennial does not translate it): types and names only,
# the types `os` names (`FileInfo`, `FileMode`) and the error its models return (`PathError`,
# TrustedCode/os.lean).
translate = ["!*", "FileInfo", "FileMode", "PathError",
  # (2026-11-04) with its body, so that the models' errors are ones `fmt` formats (`fmtErrorOk`)
  "PathError.Error",
  # (2026-11-07) the package-level variables (the error variables, internal/oserror's; `SkipDir`,
  # `SkipAll`, the `var _ I = (*subFS)(nil)` assertions) and the functions their initializers call,
  # as Perennial's io/fs.toml: what importing io/fs runs
  "ErrInvalid", "ErrPermission", "ErrExist", "ErrNotExist", "ErrClosed",
  "errInvalid", "errPermission", "errExist", "errNotExist", "errClosed",
  "SkipDir", "SkipAll", "_",
  # (2026-11-13) what os's `fileStat.IsDir` and fileutil's CheckDirPermission call
  "FileMode.IsDir", "FileMode.Perm",
  # (2026-11-13, os.MkdirAll's proof) the constant FileMode.IsDir tests
  "ModeDir",
  # (2026-11-14, wal-leaf5: fileutil.CheckDirPermission's proof) the constant FileMode.Perm masks with
  "ModePerm"]
imports = ["!*", "errors", "internal/oserror", "io", "time"]

# (2026-11-07) every type declaration goose supports, as Perennial's: the `var _ I = ...`
# assertions convert to interface types
translate_types = true
