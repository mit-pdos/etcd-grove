# Project bboltfs's `internal/poll` (etc/goose.py; Perennial's imports Perennial's `syscall`, which
# must not share an import closure with this repository's): the types, and the package-level
# variable initializers (what importing it runs), as Perennial's internal/poll.toml: `errors.New`
# errors, `ErrNetClosing`/`ErrDeadlineExceeded` values, `syscall`'s errno values, the hook function
# values (`syscall.Close`, `Accept`, `Accept4`), `supportCopyFileRange = sync.OnceValue(...)`
# (builds the closure; does not call it) and `splicePipePool`'s `sync.Pool` literal. `os`'s
# initializer reads `ErrNoDeadline` and `ErrDeadlineExceeded`.
translate = ["!*",
  "supportCopyFileRange",
  "errEAGAIN", "errEINVAL", "errENOENT",
  "ErrNetClosing", "ErrFileClosing", "ErrNoDeadline", "ErrDeadlineExceeded", "ErrNotPollable",
  "TestHookDidWritev", "TestHookDidSendFile",
  "Accept4Func", "CloseFunc", "AcceptFunc",
  "splicePipePool", "_",
  # (2026-11-14, `io.Copy` of two files: notes/wal-fsext-plan.md, "io.Copy log") what os's trusted
  # `File.copyFileRange` (its inlined `CopyFileRange` loop) calls: the errno dispatch, Go's body
  "handleCopyFileRangeErr", "maxCopyFileRangeRound",
]

imports = ["!*", "errors", "sync", "syscall", "internal/syscall/unix"]

# translate the definitions of all type declarations goose supports
translate_types = true
