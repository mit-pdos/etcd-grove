# etcd's own raft dependency (go.etcd.io/raft/v3 v3.7.0; see raft/v3/raftpb.toml): types and
# names only, for the types of the server's fields (raft.Node, raft.MemoryStorage, ...).
translate = ["!*"]
imports = ["!*", "go.etcd.io/raft/v3/raftpb"]

# translate the definitions of all type declarations goose supports
translate_types = true
