# etcd's own raft dependency (go.etcd.io/raft/v3 v3.7.0, from etcd's go.mod), not the
# upamanyus/etcd-raft fork in Code/go_etcd_io/raft/: v3.7's raftpb is protobuf-go v2
# (optional fields are pointers, read through getters), the fork's is gogoproto.
# The messages the apply thread reads are structs, with their getters' bodies; the rest
# is names (and types) only. The getters read the pointer fields; a message's
# `state protoimpl.MessageState` stays opaque (see Code/google_golang_org/protobuf/runtime/protoimpl.toml).
translate = ["!*",
  "Entry", "Entry.GetTerm", "Entry.GetIndex", "Entry.GetType", "Entry.GetData",
  "EntryType", "EntryType_EntryNormal", "EntryType_EntryConfChange", "EntryType_EntryConfChangeV2",
  "EntryNormal", "EntryConfChange", "EntryConfChangeV2",
  "ConfChange", "ConfChange.GetId",
  "ConfChangeType",
  "Message", "Message.GetTo", "Message.GetType", "MessageType",
  "MessageType_MsgHup", "MessageType_MsgAppResp", "MessageType_MsgSnap", "MessageType_MsgHeartbeat",
  "MsgAppResp", "MsgSnap", "MsgHeartbeat",
  "Snapshot", "Snapshot.GetMetadata", "SnapshotMetadata", "SnapshotMetadata.GetIndex",
  "HardState", "HardState.GetTerm", "HardState.GetVote", "HardState.GetCommit"]
imports = ["!*", "google.golang.org/protobuf/runtime/protoimpl"]

# translate the definitions of all type declarations goose supports
translate_types = true
